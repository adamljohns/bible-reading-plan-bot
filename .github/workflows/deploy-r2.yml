name: Deploy site to R2
# usmcmin.org is served from Cloudflare R2 (bucket: usmcmin-site) via the
# `usmcmin-site` Worker. This action syncs docs/ -> R2 on every push to main,
# replacing the GitHub Pages build (which stays enabled only as a fallback).
#
# NOTE: this is `rclone sync`. MP4/M4A under assets/media and assets/video are
# uploaded out-of-band (rclone copy). Exclude them or a grind deploy deletes
# files that are not in the git checkout (2026-08-22 plan.html v32 wipe).
#
# The exclude pattern must be `assets/media/**.mp4`, NOT `assets/media/**/*.mp4`.
# In rclone, the `/` in `**/*` requires at least one intervening directory, so
# `**/*.mp4` silently fails to match files sitting directly in assets/media --
# which is where the plan overview videos live. That is why the v32 MP4 was
# deleted on 08-22, again on 08-23 21:33, and again on 08-24 02:00 despite the
# exclude appearing to be in place. Verified with rclone on 2026-08-23.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-r2
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The approval gate dates each post by its FIRST COMMIT, which needs
          # real history. actions/checkout defaults to a shallow clone
          # (fetch-depth 1), so every file looks like it was added in that one
          # commit -- on 2026-08-26 that made the gate report 37 posts as
          # "published today, no APPROVE" and blocked the deploy.
          # filter=blob:none fetches the full commit graph without file blobs,
          # so this stays fast on a repo this size.
          fetch-depth: 0
          filter: blob:none
      - name: Normalize social share metadata
        run: |
          python3 bin/normalize_social_metadata.py --root docs
          python3 - <<'PY'
          from pathlib import Path
          required = {
              "og-home-2026-07.png", "og-default-2026-07.png", "og-bible-2026-07.png",
              "og-dictionary-2026-07.png", "og-churches-2026-07.png", "og-worship-2026-07.png",
              "og-assessments-2026-07.png", "og-blog-2026-07.png",
              "og-resources-2026-07.png", "og-connect-2026-07.png",
          }
          present = {p.name for p in Path("docs/assets/og").glob("*.png")}
          missing = required - present
          if missing:
              raise SystemExit(f"missing social cards: {sorted(missing)}")
          print(f"PASS: all {len(required)} social cards present")
          PY
      - name: Approval gate (blocks the deploy on a new breach)
        # P0's whole point is that "hidden until APPROVE" is a MECHANISM, not an
        # honour system. This runs BEFORE the sync, so an unapproved, publicly
        # indexable page cannot reach the live site at all.
        #
        # It fails only on a NEW breach. The 14 pre-existing unapproved posts are
        # a logged gap awaiting Adam's ruling and deliberately do not fail here.
        #
        # If this step fails: either record the approval in APPROVALS.md, or run
        #   python3 bin/approval_gate.py --fix docs/<path>.html
        # to hide the page until Adam approves it. Do NOT delete this step --
        # on 2026-08-25 a content commit stripped a noindex tag that had been
        # applied hours earlier, and nothing caught it until the next audit.
        run: python3 bin/approval_gate.py --audit

      - name: Install rclone
        run: sudo apt-get update -q && sudo apt-get install -y -q rclone
      - name: Sync docs/ to R2 (delete guard)
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: https://a57e8cd919350d6bb9ced6f47ef627d3.r2.cloudflarestorage.com
          RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
          RCLONE_MAX_DELETES: "50"
        run: |
          chmod +x bin/rclone-sync-guarded.sh bin/post-deploy-smoke.sh
          bin/rclone-sync-guarded.sh docs r2:usmcmin-site -- 50 \
            --exclude 'assets/media/**.mp4' \
            --exclude 'assets/media/**.m4a' \
            --exclude 'assets/video/**.mp4' \
            --exclude 'assets/video/**.m4a' \
            --checksum --fast-list \
            --transfers 64 --checkers 64 \
            --s3-upload-cutoff 200M --s3-chunk-size 32M
      - name: Post-deploy smoke gate
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: "454000856"
        run: bin/post-deploy-smoke.sh org
