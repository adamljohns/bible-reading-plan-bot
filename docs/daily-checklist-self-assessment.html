      {letter:'L',word:'Loved First',subword:'Receiving, then loving',summary:'Did love begin with God today?',text:'God loved us and sent His Son before we loved Him. Did you receive that love today, and did it become love for God and people?',scripture:'1 John 4:10, 19',questions:['Did you begin with God\'s love rather than your own effort?','Did that love reach a person, not merely remain a thought?'],formation:{habit:'Name one person and show God\'s prior love in a concrete act.',prayer:'Father, I love because You loved me first.',convo:'Brother, where did my love today start with me instead of Christ?',memory:'1 John 4:19 — "We love because he first loved us."',memRef:'1+John+4:19'},rubrics:[{range:'1–3',text:'I tried to produce love without receiving Christ\'s love first.'},{range:'4–5',text:'I remembered His love, but my response was thin.'},{range:'6–7',text:'His love shaped a real response today.'},{range:'8–10',text:'I received His love and let it govern my dealings with people.'}]},
      {letter:'F',word:'Formed Body',subword:'A living sacrifice',summary:'Did I offer the body God formed?',text:'God formed you in the womb. Did you present your body to Him today as a living sacrifice, or treat it as yours alone?',scripture:'Psalm 139:13–14; Romans 12:1',questions:['Did your body serve worship rather than appetite?','Was there one concrete act of bodily obedience?'],formation:{habit:'Offer one bodily choice—sleep, food, work, or restraint—to God before making it.',prayer:'Lord, this body is Yours. Make it a living sacrifice.',convo:'Brother, where am I still treating my body as my own?',memory:'Romans 12:1 — present your bodies as a living sacrifice.',memRef:'Romans+12:1'},rubrics:[{range:'1–3',text:'I used my body without reference to the God who formed it.'},{range:'4–5',text:'I intended surrender, but appetite won several choices.'},{range:'6–7',text:'I offered real bodily obedience today.'},{range:'8–10',text:'My body was consciously presented for worship.'}]},
