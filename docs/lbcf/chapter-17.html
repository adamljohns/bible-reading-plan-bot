    <link rel="stylesheet" href="../assets/css/lbcf.css">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        :root { --bg-dark:#000; --bg-card:#111; --gold:#D4AF37; --gold-light:#F4D470; --white:#FFF; --gray:#888; --border:#333; }
        body { font-family:'Inter',sans-serif; background:var(--bg-dark); color:var(--white); min-height:100vh; line-height:1.65; }
        nav { display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:4px 8px; padding:10px 16px;
              border-bottom:1px solid var(--border); position:sticky; top:0;
              background:rgba(0,0,0,0.95); backdrop-filter:blur(8px); z-index:100; }
        nav a { color:var(--gray); text-decoration:none; font-size:0.8rem; display:inline-flex; align-items:center;
                gap:3px; padding:3px 6px; border-radius:6px; transition:color 0.2s; }
        nav a:hover, nav a.active { color:var(--gold); }
        .site-icon { vertical-align:middle; opacity:0.85; margin-right:3px; }
        body.light-mode .site-icon { filter:brightness(0.55); }
        .container { max-width:1100px; margin:0 auto; padding:24px 20px 60px; }
        .bte-theme-toggle {
            position: fixed; top: 12px; right: 12px; z-index: 9999;
            display: flex; align-items: center;
            background: rgba(30,30,30,0.9); border: 1px solid #333;
            border-radius: 20px; padding: 4px 8px; cursor: pointer; gap: 5px;
        }
        .toggle-icon { font-size: 0.85rem; line-height:1; }
        .toggle-track { width: 30px; height: 16px; background: #444; border-radius: 8px; position: relative; }
        .toggle-knob {
            width: 12px; height: 12px; background: var(--gold);
            border-radius: 50%; position: absolute; top: 2px; left: 2px; transition: left 0.25s;
        }
        body.light-mode .toggle-knob { left: 16px; }
        body.light-mode { background:#F4ECD8; color:#1a1a1a; }
        body.light-mode nav { background:rgba(244,236,216,0.97) !important; border-bottom-color:#d4d0c8; }
        body.light-mode nav a { color:#555 !important; }
        body.light-mode nav a:hover, body.light-mode nav a.active { color:#8a6a1a !important; }
        body.light-mode .bte-theme-toggle { background:rgba(220,215,205,0.95); border-color:#bbb; }
    </style>
</head>
<body>
    <div class="bte-theme-toggle" onclick="bteToggleTheme()" title="Toggle dark/light mode">
        <span class="toggle-icon moon-icon">🌙</span>
        <div class="toggle-track"><div class="toggle-knob"></div></div>
        <span class="toggle-icon sun-icon">☀️</span>
    </div>
    <nav>
        <a href="../index.html"><img src="../assets/icons/shield-home-48.png" class="site-icon" alt="home" width="16" height="16"> U.S.M.C. Ministries Home</a>
        <a href="../watchman.html"><img src="../assets/icons/shield-bible.png" class="site-icon" alt="bible" width="16" height="16"> Watchman Bible Plan</a>

        <a href="../lexicon.html"><img src="../assets/icons/shield-alpha-omega-48.png" class="site-icon" alt="lexicon" width="16" height="16"> Lexicon</a>
        <a href="../cross-references.html"><img src="../assets/icons/shield-infinity-rope-48.png" class="site-icon" alt="cross-refs" width="16" height="16"> Cross-References</a>
        <a href="../dictionary/index.html"><img src="../assets/icons/shield-book-greek-48.png" class="site-icon" alt="dictionary" width="16" height="16"> Dictionary</a>
        <a href="../lbcf.html" class="active"><img src="../assets/icons/shield-cross.png" class="site-icon" alt="lbcf" width="16" height="16"> 1689 LBCF</a>
        <a href="../blog.html"><img src="../assets/icons/shield-blog-quill-48.png" class="site-icon" alt="blog" width="16" height="16"> Blog</a>
        <a href="../connect.html"><img src="../assets/icons/shield-handshake.png" class="site-icon" alt="connect" width="16" height="16"> Connect</a>
    </nav>
    <div class="container">
        <div id="lbcf-chap-target"></div>
    </div>
    <script src="../assets/js/lbcf-render.js?v=20260527"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const target = document.getElementById('lbcf-chap-target');
            window.LBCF.renderChapter(17, target).catch(err => {
                target.innerHTML = '<p style="color:var(--gray);text-align:center;padding:40px 20px;">Failed to load chapter: ' + err.message + '</p>';
            });
        });
        function bteToggleTheme() {
            document.body.classList.toggle('light-mode');
            try { localStorage.setItem('moop-theme', document.body.classList.contains('light-mode') ? 'light' : 'dark'); } catch(e){}
        }
        try { if (localStorage.getItem('moop-theme') === 'light') document.body.classList.add('light-mode'); } catch(e){}
    </script>
</body>
</html>
