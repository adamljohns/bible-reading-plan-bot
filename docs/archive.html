<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="canonical" href="https://usmcmin.org/archive.html">
    <link rel="icon" type="image/svg+xml" href="/assets/icons/favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <meta property="og:title" content="Workflow Archive — U.S.M.C. Ministries">
    <title>Workflow Archive — USMC Ministries</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-dark: #000000;
            --bg-card: #111111;
            --bg-card-hover: #1a1a1a;
            --bg-step: #1c1c1c;
            --gold: #D4AF37;
            --gold-light: #F4D470;
            --gold-dim: rgba(212,175,55,0.15);
            --white: #FFFFFF;
            --gray: #888888;
            --gray-light: #aaaaaa;
            --border: #333333;
            --green: #4CAF50;
            --yellow: #FFC107;
            --red: #f44336;
            --blue: #2196F3;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: var(--white);
            min-height: 100vh;
            line-height: 1.6;
        }

        h1, h2, h3, h4 { font-family: 'Playfair Display', serif; font-weight: 700; }

        /* ── PIN Screen ── */
        #pin-screen {
            position: fixed; inset: 0;
            background: #000;
            display: flex; align-items: center; justify-content: center;
            z-index: 9999;
            flex-direction: column; gap: 24px;
        }
        #pin-screen.hidden { display: none; }
        .pin-box {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 40px 48px;
            text-align: center;
            max-width: 340px; width: 90%;
        }
        .pin-box .lock-icon { font-size: 2.5rem; margin-bottom: 12px; }
        .pin-box h2 { font-size: 1.4rem; margin-bottom: 6px; color: var(--gold); font-family: 'Playfair Display', serif; }
        .pin-box p { color: var(--gray); font-size: 0.85rem; margin-bottom: 24px; }
        .pin-dots {
            display: flex; gap: 12px; justify-content: center;
            margin-bottom: 28px;
        }
        .pin-dot {
            width: 14px; height: 14px; border-radius: 50%;
            border: 2px solid var(--border);
            background: transparent;
            transition: all 0.15s;
        }
        .pin-dot.filled { background: var(--gold); border-color: var(--gold); }
        .pin-keypad {
            display: grid; grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }
        .pin-key {
            background: #1a1a1a;
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--white);
            font-size: 1.3rem;
            font-weight: 600;
            padding: 16px;
            cursor: pointer;
            transition: all 0.15s;
        }
        .pin-key:hover { background: #252525; border-color: var(--gold); color: var(--gold); }
        .pin-key.del { font-size: 1rem; color: var(--gray); }
        .pin-error { color: var(--red); font-size: 0.85rem; margin-top: 12px; min-height: 20px; }

        /* ── Main Content ── */
        #main-content { display: block; }

        /* ── Header ── */
        .page-header {
            text-align: center;
            padding: 28px 20px 18px;
            border-bottom: 1px solid var(--border);
        }
        .page-header h1 { font-size: 1.9rem; color: var(--white); margin-bottom: 4px; }
        .page-header .subtitle { color: var(--gold); font-size: 0.9rem; }
        .page-header .stats-row {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin-top: 12px;
            flex-wrap: wrap;
        }
        .stat-pill {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 5px 14px;
            font-size: 0.8rem;
            color: var(--gray-light);
        }
        .stat-pill span { color: var(--gold); font-weight: 600; }

        /* ── Nav Links ── */
        .nav-links {
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 12px 20px;
            flex-wrap: wrap;
            border-bottom: 1px solid var(--border);
        }
        .nav-link {
            color: var(--gray-light);
            text-decoration: none;
            font-size: 0.82rem;
            padding: 5px 12px;
            border: 1px solid var(--border);
            border-radius: 20px;
            transition: all 0.2s;
        }
        .nav-link:hover { color: var(--gold); border-color: var(--gold); }

        /* ── Filter Bar ── */
        .filter-bar {
            display: flex;
            gap: 8px;
            padding: 16px 20px;
            max-width: 960px;
            margin: 0 auto;
            flex-wrap: wrap;
        }
        .filter-btn {
            padding: 7px 18px;
            border: 1px solid var(--border);
            border-radius: 20px;
            background: transparent;
            color: var(--gray-light);
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            transition: all 0.2s;
        }
        .filter-btn:hover { border-color: var(--gold); color: var(--gold); }
        .filter-btn.active { background: var(--gold); color: #000; border-color: var(--gold); font-weight: 600; }

        /* ── Workflow Grid ── */
        .workflow-grid {
            max-width: 960px;
            margin: 0 auto;
            padding: 0 16px 40px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
            gap: 14px;
        }

        /* ── Workflow Card ── */
        .workflow-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 18px 20px;
            cursor: pointer;
            transition: all 0.25s;
            position: relative;
        }
        .workflow-card:hover {
            background: var(--bg-card-hover);
            border-color: var(--gold);
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(212,175,55,0.12);
        }
        .workflow-card.expanded {
            border-color: var(--gold);
            background: var(--bg-card-hover);
        }

        /* Card header row */
        .card-header {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 12px;
        }
        .card-icon { font-size: 1.6rem; line-height: 1; flex-shrink: 0; padding-top: 2px; }
        .card-meta { flex: 1; min-width: 0; }
        .card-title {
            font-family: 'Playfair Display', serif;
            color: var(--gold);
            font-size: 1.05rem;
            line-height: 1.2;
            margin-bottom: 4px;
        }
        .card-category {
            font-size: 0.75rem;
            color: var(--gray);
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }
        .status-badge {
            font-size: 0.78rem;
            padding: 3px 10px;
            border-radius: 12px;
            font-weight: 600;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .status-active   { background: rgba(76,175,80,0.15);  color: #6fcf74; border: 1px solid rgba(76,175,80,0.3); }
        .status-waiting  { background: rgba(255,193,7,0.15);  color: #ffd54f; border: 1px solid rgba(255,193,7,0.3); }
        .status-blocked  { background: rgba(244,67,54,0.15);  color: #ef9a9a; border: 1px solid rgba(244,67,54,0.3); }
        .status-complete { background: rgba(33,150,243,0.15); color: #90caf9; border: 1px solid rgba(33,150,243,0.3); }

        /* Progress bar */
        .progress-section { margin-bottom: 10px; }
        .progress-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }
        .progress-label { font-size: 0.78rem; color: var(--gray); }
        .progress-pct { font-size: 0.78rem; color: var(--gold); font-weight: 600; }
        .progress-bar {
            height: 5px;
            background: var(--border);
            border-radius: 3px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--gold), var(--gold-light));
            border-radius: 3px;
            transition: width 0.4s ease;
        }

        /* Current step callout */
        .current-step-row {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.83rem;
            color: var(--gray-light);
        }
        .current-step-dot {
            width: 7px; height: 7px;
            border-radius: 50%;
            background: var(--gold);
            flex-shrink: 0;
            box-shadow: 0 0 6px var(--gold);
        }
        .current-step-name { color: var(--white); font-weight: 500; }

        /* Expand toggle */
        .expand-hint {
            text-align: right;
            font-size: 0.72rem;
            color: var(--gray);
            margin-top: 10px;
            transition: color 0.2s;
        }
        .workflow-card:hover .expand-hint { color: var(--gold); }

        /* ── Expanded Detail ── */
        .card-detail {
            display: none;
            margin-top: 18px;
            padding-top: 18px;
            border-top: 1px solid var(--border);
        }
        .workflow-card.expanded .card-detail { display: block; animation: fadeIn 0.25s ease; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

        /* Step list */
        .steps-list { list-style: none; display: flex; flex-direction: column; gap: 6px; }
        .step-item {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 9px 12px;
            border-radius: 8px;
            background: var(--bg-step);
            border: 1px solid transparent;
            transition: all 0.2s;
        }
        .step-item.step-done {
            opacity: 0.55;
        }
        .step-item.step-done .step-name { text-decoration: line-through; color: var(--gray); }
        .step-item.step-current {
            background: var(--gold-dim);
            border-color: var(--gold);
        }
        .step-item.step-next {
            border-color: rgba(212,175,55,0.35);
        }
        .step-num {
            width: 22px; height: 22px;
            border-radius: 50%;
            background: var(--border);
            color: var(--gray);
            font-size: 0.72rem;
            font-weight: 700;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
            margin-top: 1px;
        }
        .step-item.step-done .step-num { background: rgba(76,175,80,0.2); color: var(--green); }
        .step-item.step-current .step-num { background: var(--gold); color: #000; }
        .step-item.step-next .step-num { background: rgba(212,175,55,0.2); color: var(--gold); }
        .step-body { flex: 1; min-width: 0; }
        .step-name { font-size: 0.87rem; color: var(--white); font-weight: 500; }
        .step-tag {
            font-size: 0.7rem;
            padding: 1px 7px;
            border-radius: 8px;
            display: inline-block;
            margin-top: 3px;
        }
        .tag-current { background: rgba(212,175,55,0.2); color: var(--gold); }
        .tag-next    { background: rgba(212,175,55,0.12); color: var(--gold-light); }
        .tag-done    { background: rgba(76,175,80,0.15); color: #6fcf74; }

        /* Action buttons */
        .card-actions {
            display: flex;
            gap: 8px;
            margin-top: 16px;
            flex-wrap: wrap;
        }
        .btn-advance {
            padding: 8px 18px;
            background: var(--gold);
            color: #000;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.83rem;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            transition: background 0.2s;
        }
        .btn-advance:hover { background: var(--gold-light); }
        .btn-advance:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn-back {
            padding: 8px 14px;
            background: transparent;
            color: var(--gray);
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.83rem;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s;
        }
        .btn-back:hover { border-color: var(--gray-light); color: var(--white); }
        .btn-back:disabled { opacity: 0.3; cursor: not-allowed; }
        .btn-reset {
            padding: 8px 14px;
            background: transparent;
            color: var(--red);
            border: 1px solid rgba(244,67,54,0.3);
            border-radius: 8px;
            font-size: 0.83rem;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s;
            margin-left: auto;
        }
        .btn-reset:hover { background: rgba(244,67,54,0.1); }

        /* ── Empty state ── */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            color: var(--gray);
        }
        .empty-state .icon { font-size: 3rem; margin-bottom: 12px; }

        /* ── Responsive ── */
        @media (max-width: 600px) {
            .workflow-grid { grid-template-columns: 1fr; padding: 0 12px 30px; }
            .page-header h1 { font-size: 1.5rem; }
            .filter-bar { padding: 12px; }
        }
    </style>
</head>
<body>

<div id="pin-screen">
    <div class="pin-box">
        <div class="lock-icon">🗄</div>
        <h2>Workflow Archive</h2>
        <p>Enter the PIN to continue</p>
        <div class="pin-dots">
            <div class="pin-dot" id="dot-0"></div><div class="pin-dot" id="dot-1"></div>
            <div class="pin-dot" id="dot-2"></div><div class="pin-dot" id="dot-3"></div>
        </div>
        <div class="pin-keypad">
            <button class="pin-key" onclick="pinKey('1')">1</button>
            <button class="pin-key" onclick="pinKey('2')">2</button>
            <button class="pin-key" onclick="pinKey('3')">3</button>
            <button class="pin-key" onclick="pinKey('4')">4</button>
            <button class="pin-key" onclick="pinKey('5')">5</button>
            <button class="pin-key" onclick="pinKey('6')">6</button>
            <button class="pin-key" onclick="pinKey('7')">7</button>
            <button class="pin-key" onclick="pinKey('8')">8</button>
            <button class="pin-key" onclick="pinKey('9')">9</button>
            <button class="pin-key" onclick="pinKey('0')" style="grid-column:2">0</button>
            <button class="pin-key del" onclick="pinDel()">&#9003;</button>
        </div>
        <div class="pin-error" id="pin-error"></div>
    </div>
</div>

<div id="main-content" style="display:none">
    <div class="page-header">
        <h1>🗄 Workflow Archive</h1>
        <div class="subtitle">Completed &amp; retired flight plans &mdash; <span id="arch-count">0</span> archived</div>
    </div>
    <nav class="nav-links">
        <a href="workflows.html" class="nav-link">&larr; Active Board</a>
        <a href="tacc.html" class="nav-link">&#9875; Captain's Wheelhouse</a>
        <a href="index.html" class="nav-link">&#127968; Home</a>
    </nav>
    <div class="workflow-grid" id="archive-grid"></div>
</div>

<script src="assets/workflows-data.js"></script>
<script>
// ── PIN (same gate/PIN as workflows.html) ──
const WF_PIN='5683', WF_SESSION_KEY='wf_unlocked'; let wfPinEntry='';
(function(){ if (sessionStorage.getItem(WF_SESSION_KEY)==='true') wfUnlock(); })();
function wfUnlock(){ document.getElementById('pin-screen').classList.add('hidden'); document.getElementById('main-content').style.display=''; renderArchive(); }
function pinKey(d){ if(wfPinEntry.length>=4) return; wfPinEntry+=d; dots(); if(wfPinEntry.length===4) setTimeout(checkPin,100); }
function pinDel(){ wfPinEntry=wfPinEntry.slice(0,-1); dots(); document.getElementById('pin-error').textContent=''; }
function dots(){ for(let i=0;i<4;i++) document.getElementById('dot-'+i).classList.toggle('filled', i<wfPinEntry.length); }
function checkPin(){ if(wfPinEntry===WF_PIN){ sessionStorage.setItem(WF_SESSION_KEY,'true'); wfUnlock(); } else { document.getElementById('pin-error').textContent='Incorrect PIN. Try again.'; wfPinEntry=''; dots(); } }
document.addEventListener('keydown', e=>{ if(document.getElementById('pin-screen').classList.contains('hidden')) return; if(e.key>='0'&&e.key<='9') pinKey(e.key); else if(e.key==='Backspace') pinDel(); });

// ── STATE (same shape + floor rules as workflows.html) ──
const STORAGE_KEY='wf-state-v1';
function loadState(){ try{ const r=localStorage.getItem(STORAGE_KEY); return r?JSON.parse(r):null; }catch(e){ return null; } }
function merge(){ const saved=loadState(); return WORKFLOWS_DEFAULT.map(w=>{
    const o=saved?saved.find(s=>s.id===w.id):null;
    const cs=o?Math.max(w.currentStep||0,o.currentStep||0):(w.currentStep||0);
    let archived; if(o&&o.archived===false) archived=false; else archived=!!(w.archived||(o&&o.archived));
    let status; if(cs>=w.steps.length) status='complete'; else if(o&&(o.status==='blocked'||o.status==='waiting')) status=o.status; else status=w.status;
    return {...w, currentStep:cs, status, archived};
}); }
function saveAll(list){ const slim=list.map(w=>({id:w.id,currentStep:w.currentStep,status:w.status,archived:!!w.archived})); try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(slim)); }catch(e){} }
let MERGED=[];
function unarchive(id){ const w=MERGED.find(x=>x.id===id); if(!w) return; if(!confirm('Restore "'+w.title+'" to the active board?')) return; w.archived=false; saveAll(MERGED); renderArchive(); }

function renderArchive(){
    MERGED=merge();
    const arch=MERGED.filter(w=>w.archived);
    document.getElementById('arch-count').textContent=arch.length;
    const grid=document.getElementById('archive-grid');
    if(!arch.length){ grid.innerHTML='<div style="grid-column:1/-1; text-align:center; color:var(--gray); padding:48px 20px;">Nothing archived yet. Complete a workflow on the board and tap &#128451; Archive to retire it here.</div>'; return; }
    grid.innerHTML=arch.map(w=>{
        const st=STATUS_LABELS[w.status]||STATUS_LABELS.complete;
        const steps=w.steps.map((s,i)=>'<li class="step-item '+(i<w.currentStep?'step-done':'')+'"><div class="step-num">'+(i+1)+'</div><div class="step-body"><div class="step-name">'+s.name+'</div></div></li>').join('');
        return '<div class="workflow-card expanded">'
          +'<div class="card-header"><div class="card-icon">'+w.icon+'</div><div class="card-meta"><div class="card-title">'+w.title+'</div><div class="card-category">'+w.category+'</div></div><div class="status-badge '+st.cls+'">'+st.icon+' '+st.label+'</div></div>'
          +'<ul class="steps-list">'+steps+'</ul>'
          +'<div class="card-actions"><button onclick="unarchive(\''+w.id+'\')" style="background:transparent; border:1px solid var(--border); color:var(--gray-light); border-radius:8px; padding:7px 14px; cursor:pointer; font-size:0.82rem; font-family:\'Inter\',sans-serif;">&#8617; Restore to board</button></div>'
          +'</div>';
    }).join('');
}
</script>
</body>
</html>
