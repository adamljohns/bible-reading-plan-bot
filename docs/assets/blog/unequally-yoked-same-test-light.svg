<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1010" width="720" height="1010" role="img" aria-labelledby="t d">
<title id="t">Four platforms, one test</title>
<desc id="d">A card listing four sourced public cases measured by the same yoke test. One: CPAC, Dallas area, March 27, 2026, a rabbi opened day two with prayer from the main stage; mark: joint prayer. Two: the Make Heaven Crowded Tour, November 13, 2026, a night billed as gospel centered was held at the school of a Word of Faith teacher who was listed to speak; mark: banner. Three: the Christ Is King conference near Dallas, November 12 to 14, 2026, a Roman Catholic was handed the last word, the closing keynote, under Christ’s name; mark: the last word. Four: the 2024 Democratic platform pledges to make Roe the law of the land again; marks: direction, name and command for those who run under it.</desc>
<rect x="1" y="1" width="718" height="1008" rx="18" fill="#ffffff" stroke="#d4d0c8" stroke-width="2"/>
<text x="360" y="72" font-family="Georgia, 'Times New Roman', serif" font-size="44" font-weight="700" fill="#1a1a1a" text-anchor="middle" >Four platforms, one test</text>
<text x="360" y="112" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#666666" text-anchor="middle" >If the verse applies in one place, it applies in all of them.</text>
<rect x="36" y="140" width="648" height="188" rx="14" fill="#F7F4EC" stroke="#d4d0c8" stroke-width="2"/>
<rect x="36" y="140" width="8" height="188" rx="4" fill="#8a6d10"/>
<text x="64" y="182" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#8a6d10" text-anchor="start" letter-spacing="1.5">CPAC USA</text>
<text x="64" y="212" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#666666" text-anchor="start" >Dallas area · March 27, 2026</text>
<text x="64" y="248.0" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#333333" text-anchor="start" >A rabbi opens day two with prayer</text>
<text x="64" y="280.5" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#333333" text-anchor="start" >from the main stage.</text>
<text x="660" y="312" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#8a3c22" text-anchor="end" letter-spacing="1">MARK: JOINT PRAYER</text>
<rect x="36" y="344" width="648" height="188" rx="14" fill="#F7F4EC" stroke="#d4d0c8" stroke-width="2"/>
<rect x="36" y="344" width="8" height="188" rx="4" fill="#8a6d10"/>
<text x="64" y="386" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#8a6d10" text-anchor="start" letter-spacing="1.5">MAKE HEAVEN CROWDED TOUR</text>
<text x="64" y="416" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#666666" text-anchor="start" >Woodland Park, Colo. · Nov. 13, 2026</text>
<text x="64" y="452.0" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#333333" text-anchor="start" >A “gospel centered” night at the school of</text>
<text x="64" y="484.5" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#333333" text-anchor="start" >a Word of Faith teacher, listed to speak.</text>
<text x="660" y="516" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#8a3c22" text-anchor="end" letter-spacing="1">MARK: BANNER</text>
<rect x="36" y="548" width="648" height="188" rx="14" fill="#F7F4EC" stroke="#d4d0c8" stroke-width="2"/>
<rect x="36" y="548" width="8" height="188" rx="4" fill="#8a6d10"/>
<text x="64" y="590" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#8a6d10" text-anchor="start" letter-spacing="1.5">CHRIST IS KING CONFERENCE</text>
<text x="64" y="620" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#666666" text-anchor="start" >Irving, Texas · Nov. 12–14, 2026</text>
<text x="64" y="656.0" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#333333" text-anchor="start" >A Roman Catholic is handed the last word,</text>
<text x="64" y="688.5" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#333333" text-anchor="start" >the closing keynote, under Christ’s name.</text>
<text x="660" y="720" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#8a3c22" text-anchor="end" letter-spacing="1">MARK: THE LAST WORD</text>
<rect x="36" y="752" width="648" height="188" rx="14" fill="#F7F4EC" stroke="#d4d0c8" stroke-width="2"/>
<rect x="36" y="752" width="8" height="188" rx="4" fill="#8a6d10"/>
<text x="64" y="794" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#8a6d10" text-anchor="start" letter-spacing="1.5">DEMOCRATIC PLATFORM</text>
<text x="64" y="824" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#666666" text-anchor="start" >Adopted August 2024</text>
<text x="64" y="860.0" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#333333" text-anchor="start" >“…make Roe the law of the land again.”</text>
<text x="64" y="892.5" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#333333" text-anchor="start" >Christians run for office under it.</text>
<text x="660" y="924" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#8a3c22" text-anchor="end" letter-spacing="1">MARK: DIRECTION · NAME · COMMAND</text>
<text x="360" y="978" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#666666" text-anchor="middle" >Sources are linked in the post  ·  usmcmin.org</text>
</svg>
