<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Listen · U.S.M.C. Ministries</title>
<link rel="icon" type="image/svg+xml" href="/assets/icons/favicon.svg">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/apple-touch-icon.png">
<style>
  :root { --gold:#D4AF37; --ink:#0a0a0a; --card:#1a1a1a; --cream:#F5F3EF; --muted:#8b949e; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:var(--ink); color:var(--cream);
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display:flex; align-items:center; justify-content:center; padding:24px; }
  .card { width:100%; max-width:520px; background:var(--card); border:1px solid #2a2a2a;
    border-radius:16px; padding:28px 24px; text-align:center; }
  .brand { color:var(--gold); font-size:13px; letter-spacing:.12em; text-transform:uppercase; margin:0 0 10px; }
  h1 { font-size:22px; margin:0 0 22px; line-height:1.3; }
  .play { width:88px; height:88px; border-radius:50%; border:0; background:var(--gold); color:var(--ink);
    font-size:34px; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; }
  .play:focus-visible, .row button:focus-visible { outline:3px solid var(--cream); outline-offset:3px; }
  .bar { margin:22px 0 6px; }
  input[type=range] { width:100%; accent-color:var(--gold); }
  .time { display:flex; justify-content:space-between; color:var(--muted); font-size:13px; font-variant-numeric:tabular-nums; }
  .row { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-top:18px; }
  .row button { background:transparent; color:var(--cream); border:1px solid #3a3a3a; border-radius:999px;
    padding:9px 14px; font-size:15px; cursor:pointer; min-width:56px; }
  .row button[aria-pressed=true] { background:var(--gold); color:var(--ink); border-color:var(--gold); font-weight:600; }
  .label { color:var(--muted); font-size:12px; letter-spacing:.08em; text-transform:uppercase; margin:22px 0 0; }
  .err { color:#ff8a80; }
  footer { margin-top:24px; font-size:12px; color:var(--muted); }
  footer a { color:var(--gold); text-decoration:none; }
</style>
</head>
<body>
<main class="card">
  <p class="brand">U.S.M.C. Ministries</p>
  <h1 id="title">Voice note</h1>
  <button class="play" id="play" aria-label="Play">&#9654;</button>
  <div class="bar">
    <input type="range" id="seek" min="0" max="0" step="0.1" value="0" aria-label="Seek">
    <div class="time"><span id="cur">0:00</span><span id="dur">0:00</span></div>
  </div>
  <div class="row">
    <button id="back" aria-label="Back 15 seconds">&#8634; 15</button>
    <button id="fwd" aria-label="Forward 15 seconds">15 &#8635;</button>
  </div>
  <p class="label">Speed</p>
  <div class="row" id="speeds"></div>
  <p id="msg" class="err" hidden></p>
  <audio id="audio" preload="metadata"></audio>
  <footer><a href="/">usmcmin.org</a></footer>
</main>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var src = q.get('src') || '';
  var title = q.get('t');
  var audio = document.getElementById('audio');
  var play = document.getElementById('play');
  var seek = document.getElementById('seek');
  var msg = document.getElementById('msg');
  if (title) { document.getElementById('title').textContent = title; document.title = title + ' · U.S.M.C. Ministries'; }

  // Same-site media only.
  var ok = /^\/?assets\/(media|audio|blog)\/[A-Za-z0-9._\/-]+\.(m4a|mp3|mp4|aac)$/.test(src) && src.indexOf('..') === -1;
  if (!ok) { msg.textContent = 'Audio not found.'; msg.hidden = false; play.disabled = true; return; }
  audio.src = '/' + src.replace(/^\//, '');

  function fmt(s) { s = Math.max(0, Math.floor(s || 0)); var m = Math.floor(s / 60); var r = s % 60; return m + ':' + (r < 10 ? '0' : '') + r; }

  var SPEEDS = [1, 1.25, 1.5, 1.75, 2, 2.5];
  var saved = parseFloat(localStorage.getItem('usmc-listen-speed')) || 1;
  if (SPEEDS.indexOf(saved) === -1) saved = 1;
  var box = document.getElementById('speeds');
  SPEEDS.forEach(function (s) {
    var b = document.createElement('button');
    b.textContent = s + '×';
    b.setAttribute('aria-pressed', String(s === saved));
    b.addEventListener('click', function () { setSpeed(s); });
    box.appendChild(b);
  });
  function setSpeed(s) {
    audio.playbackRate = s; audio.defaultPlaybackRate = s;
    try { localStorage.setItem('usmc-listen-speed', String(s)); } catch (e) {}
    [].forEach.call(box.children, function (b) { b.setAttribute('aria-pressed', String(b.textContent === s + '×')); });
  }
  setSpeed(saved);

  play.addEventListener('click', function () { if (audio.paused) audio.play(); else audio.pause(); });
  audio.addEventListener('play', function () { audio.playbackRate = audio.defaultPlaybackRate; play.innerHTML = '&#10074;&#10074;'; play.setAttribute('aria-label', 'Pause'); });
  audio.addEventListener('pause', function () { play.innerHTML = '&#9654;'; play.setAttribute('aria-label', 'Play'); });
  audio.addEventListener('loadedmetadata', function () { seek.max = audio.duration; document.getElementById('dur').textContent = fmt(audio.duration); });
  audio.addEventListener('timeupdate', function () { if (!seek.matches(':active')) seek.value = audio.currentTime; document.getElementById('cur').textContent = fmt(audio.currentTime); });
  audio.addEventListener('error', function () { msg.textContent = 'Audio could not load.'; msg.hidden = false; });
  seek.addEventListener('input', function () { audio.currentTime = parseFloat(seek.value); });
  document.getElementById('back').addEventListener('click', function () { audio.currentTime = Math.max(0, audio.currentTime - 15); });
  document.getElementById('fwd').addEventListener('click', function () { audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + 15); });
})();
</script>
</body>
</html>
