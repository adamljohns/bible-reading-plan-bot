<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 760" width="720" height="760" role="img" aria-labelledby="t d">
<title id="t">What makes a yoke: four marks</title>
<desc id="d">Four numbered tiles. One, Direction: am I bound to go where my partner goes, past the one task? Two, Name: do we stand under one name, so his words are heard as mine? Three, Command: can someone who does not own my Lord bind what I do? Four, Banner: does the bond claim to speak for Christ or his gospel? Buying milk has none of the four; marriage has all four.</desc>
<rect x="1" y="1" width="718" height="758" rx="18" fill="#161b22" stroke="#30363d" stroke-width="2"/>
<text x="360" y="74" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="700" fill="#e6edf3" text-anchor="middle" >What makes a yoke</text>
<text x="360" y="116" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#8b949e" text-anchor="middle" >Four marks. The more a bond has, the tighter it binds.</text>
<rect x="36" y="150" width="316" height="232" rx="14" fill="#1c232d" stroke="#30363d" stroke-width="2"/>
<circle cx="80" cy="200" r="25" fill="none" stroke="#d4af37" stroke-width="3"/>
<text x="80" y="210" font-family="Georgia, 'Times New Roman', serif" font-size="29" font-weight="700" fill="#d4af37" text-anchor="middle" >1</text>
<text x="120" y="210" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#d4af37" text-anchor="start" letter-spacing="2">DIRECTION</text>
<text x="60" y="266.0" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#c9d1d9" text-anchor="start" >Am I bound to go</text>
<text x="60" y="300.32" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#c9d1d9" text-anchor="start" >where my partner goes,</text>
<text x="60" y="334.64" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#c9d1d9" text-anchor="start" >past the one task?</text>
<rect x="368" y="150" width="316" height="232" rx="14" fill="#1c232d" stroke="#30363d" stroke-width="2"/>
<circle cx="412" cy="200" r="25" fill="none" stroke="#d4af37" stroke-width="3"/>
<text x="412" y="210" font-family="Georgia, 'Times New Roman', serif" font-size="29" font-weight="700" fill="#d4af37" text-anchor="middle" >2</text>
<text x="452" y="210" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#d4af37" text-anchor="start" letter-spacing="2">NAME</text>
<text x="392" y="266.0" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#c9d1d9" text-anchor="start" >Do we stand under</text>
<text x="392" y="300.32" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#c9d1d9" text-anchor="start" >one name, so his words</text>
<text x="392" y="334.64" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#c9d1d9" text-anchor="start" >are heard as mine?</text>
<rect x="36" y="400" width="316" height="232" rx="14" fill="#1c232d" stroke="#30363d" stroke-width="2"/>
<circle cx="80" cy="450" r="25" fill="none" stroke="#d4af37" stroke-width="3"/>
<text x="80" y="460" font-family="Georgia, 'Times New Roman', serif" font-size="29" font-weight="700" fill="#d4af37" text-anchor="middle" >3</text>
<text x="120" y="460" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#d4af37" text-anchor="start" letter-spacing="2">COMMAND</text>
<text x="60" y="516.0" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#c9d1d9" text-anchor="start" >Can someone who</text>
<text x="60" y="550.32" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#c9d1d9" text-anchor="start" >doesn’t own my Lord</text>
<text x="60" y="584.64" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#c9d1d9" text-anchor="start" >bind what I do?</text>
<rect x="368" y="400" width="316" height="232" rx="14" fill="#1c232d" stroke="#30363d" stroke-width="2"/>
<circle cx="412" cy="450" r="25" fill="none" stroke="#d4af37" stroke-width="3"/>
<text x="412" y="460" font-family="Georgia, 'Times New Roman', serif" font-size="29" font-weight="700" fill="#d4af37" text-anchor="middle" >4</text>
<text x="452" y="460" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#d4af37" text-anchor="start" letter-spacing="2">BANNER</text>
<text x="392" y="516.0" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#c9d1d9" text-anchor="start" >Does the bond claim</text>
<text x="392" y="550.32" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#c9d1d9" text-anchor="start" >to speak for Christ</text>
<text x="392" y="584.64" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#c9d1d9" text-anchor="start" >or His gospel?</text>
<line x1="36" y1="668" x2="684" y2="668" stroke="#30363d" stroke-width="2"/>
<text x="360" y="708" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" font-weight="600" fill="#e6edf3" text-anchor="middle" >Buying milk: none of the four.  Marriage: all four, for life.</text>
<text x="360" y="740" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#8b949e" text-anchor="middle" >2 Corinthians 6:14  ·  usmcmin.org</text>
</svg>
