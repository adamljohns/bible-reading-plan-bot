<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 340" role="img" aria-labelledby="whTitle whDesc">
  <title id="whTitle">The Word Hand</title>
  <desc id="whDesc">Original USMC-styled diagram. Five fingers: hear, read, study, memorize, meditate. Not a NavPress scan.</desc>
  <rect width="280" height="340" fill="#000"/>
  <path d="M40 28h200v284H40z" fill="none" stroke="#D4AF37" stroke-width="3"/>
  <path d="M52 40h176v260H52z" fill="none" stroke="#333" stroke-width="1"/>
  <!-- palm -->
  <path d="M78 210c0 46 28 78 62 78s62-32 62-78V168H78v42z" fill="#111" stroke="#D4AF37" stroke-width="2.2"/>
  <!-- pinky -->
  <g class="finger" data-part="pinky" tabindex="0" role="button" aria-label="Hearing — pinky">
    <rect x="82" y="92" width="22" height="88" rx="11" fill="#171717" stroke="#D4AF37" stroke-width="2"/>
    <text x="93" y="80" text-anchor="middle" fill="#D4AF37" font-size="9" font-family="system-ui,sans-serif">HEAR</text>
  </g>
  <!-- ring -->
  <g class="finger" data-part="ring" tabindex="0" role="button" aria-label="Reading — ring">
    <rect x="112" y="68" width="22" height="112" rx="11" fill="#171717" stroke="#D4AF37" stroke-width="2"/>
    <text x="123" y="56" text-anchor="middle" fill="#D4AF37" font-size="9" font-family="system-ui,sans-serif">READ</text>
  </g>
  <!-- middle -->
  <g class="finger" data-part="middle" tabindex="0" role="button" aria-label="Studying — middle">
    <rect x="142" y="52" width="22" height="128" rx="11" fill="#171717" stroke="#D4AF37" stroke-width="2"/>
    <text x="153" y="40" text-anchor="middle" fill="#D4AF37" font-size="9" font-family="system-ui,sans-serif">STUDY</text>
  </g>
  <!-- index -->
  <g class="finger" data-part="index" tabindex="0" role="button" aria-label="Memorizing — index">
    <rect x="172" y="70" width="22" height="110" rx="11" fill="#171717" stroke="#D4AF37" stroke-width="2"/>
    <text x="183" y="58" text-anchor="middle" fill="#D4AF37" font-size="9" font-family="system-ui,sans-serif">HIDE</text>
  </g>
  <!-- thumb -->
  <g class="finger" data-part="thumb" tabindex="0" role="button" aria-label="Meditating — thumb">
    <path d="M78 188c-28-6-40-28-36-52 4-22 24-34 46-28" fill="none" stroke="#D4AF37" stroke-width="18" stroke-linecap="round"/>
    <path d="M78 188c-28-6-40-28-36-52 4-22 24-34 46-28" fill="none" stroke="#171717" stroke-width="14" stroke-linecap="round"/>
    <text x="48" y="118" text-anchor="middle" fill="#D4AF37" font-size="9" font-family="system-ui,sans-serif">MEDITATE</text>
  </g>
  <text x="140" y="318" text-anchor="middle" fill="#888" font-size="10" font-family="system-ui,sans-serif">Tap a finger</text>
</svg>
