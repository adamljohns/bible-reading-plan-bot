<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 420" role="img" aria-labelledby="whTitle whDesc">
  <title id="whTitle">The Word Hand</title>
  <desc id="whDesc">Original USMC-styled Word Hand. Pinky hear, ring read, middle study, index memorize, thumb meditate. Not a NavPress scan.</desc>
  <rect width="360" height="420" fill="#000"/>
  <!-- palm -->
  <path d="M132 248c0 58 34 96 72 96s72-38 72-96v-58H132v58z" fill="#111" stroke="#D4AF37" stroke-width="2.4"/>
  <!-- pinky HEAR -->
  <g class="finger" data-part="pinky" tabindex="0" role="button" aria-label="Hearing — pinky">
    <rect x="136" y="148" width="26" height="108" rx="13" fill="#171717" stroke="#D4AF37" stroke-width="2"/>
    <text x="149" y="132" text-anchor="middle" fill="#D4AF37" font-size="11" font-family="system-ui,sans-serif" font-weight="700">HEAR</text>
  </g>
  <!-- ring READ -->
  <g class="finger" data-part="ring" tabindex="0" role="button" aria-label="Reading — ring">
    <rect x="170" y="118" width="26" height="138" rx="13" fill="#171717" stroke="#D4AF37" stroke-width="2"/>
    <text x="183" y="102" text-anchor="middle" fill="#D4AF37" font-size="11" font-family="system-ui,sans-serif" font-weight="700">READ</text>
  </g>
  <!-- middle STUDY -->
  <g class="finger" data-part="middle" tabindex="0" role="button" aria-label="Studying — middle">
    <rect x="204" y="98" width="26" height="158" rx="13" fill="#171717" stroke="#D4AF37" stroke-width="2"/>
    <text x="217" y="82" text-anchor="middle" fill="#D4AF37" font-size="11" font-family="system-ui,sans-serif" font-weight="700">STUDY</text>
  </g>
  <!-- index MEMORIZE / Hide it. -->
  <g class="finger" data-part="index" tabindex="0" role="button" aria-label="Memorizing — index">
    <rect x="238" y="122" width="26" height="134" rx="13" fill="#171717" stroke="#D4AF37" stroke-width="2"/>
    <text x="251" y="96" text-anchor="middle" fill="#D4AF37" font-size="11" font-family="system-ui,sans-serif" font-weight="700">MEMORIZE</text>
    <text x="251" y="110" text-anchor="middle" fill="#888" font-size="8" font-family="system-ui,sans-serif">Hide it.</text>
  </g>
  <!-- thumb MEDITATE -->
  <g class="finger" data-part="thumb" tabindex="0" role="button" aria-label="Meditating — thumb">
    <path d="M132 236c-36-8-52-36-46-66 6-28 32-42 58-34" fill="none" stroke="#D4AF37" stroke-width="20" stroke-linecap="round"/>
    <path d="M132 236c-36-8-52-36-46-66 6-28 32-42 58-34" fill="none" stroke="#171717" stroke-width="15" stroke-linecap="round"/>
    <text x="78" y="148" text-anchor="middle" fill="#D4AF37" font-size="11" font-family="system-ui,sans-serif" font-weight="700">MEDITATE</text>
  </g>
  <text x="180" y="398" text-anchor="middle" fill="#888" font-size="11" font-family="system-ui,sans-serif">Tap a finger</text>
</svg>
