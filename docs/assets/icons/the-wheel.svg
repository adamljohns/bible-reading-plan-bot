<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 570" role="img" aria-labelledby="wlTitle wlDesc">
  <title id="wlTitle">The Wheel</title>
  <desc id="wlDesc">Original U.S.M.C. Ministries drawing of the Wheel. Christ at the hub, obedience as the rim, four spokes: the Word, prayer, fellowship and witness. Not a NavPress scan.</desc>
  <style>
    .ink    { stroke: var(--dia-ink, #D4AF37); fill: none; stroke-linecap: round; }
    .body   { fill: var(--dia-fill, #101010); }
    .accent { stroke: var(--dia-accent, #8a6f22); fill: none; }
    .pill   { fill: var(--dia-fill, #101010); stroke: var(--dia-ink, #D4AF37); stroke-width: 2.4; }
    .lbl    { fill: var(--dia-ink, #D4AF37); font-family: "Playfair Display", Georgia, "Times New Roman", serif; font-weight: 700; letter-spacing: .04em; font-size: 21px; }
    .title  { fill: var(--dia-ink, #D4AF37); font-family: "Playfair Display", Georgia, "Times New Roman", serif; font-weight: 700; letter-spacing: .05em; font-size: 26px; }
    .sub    { fill: var(--dia-muted, #9a9a9a); font-family: Inter, system-ui, sans-serif; font-weight: 600; font-size: 14px; letter-spacing: .14em; }
    [data-part] { cursor: pointer; }
    [data-part].is-on .ink  { stroke: var(--dia-ink-on, #F4D470); }
    [data-part].is-on .pill { stroke: var(--dia-ink-on, #F4D470); stroke-width: 3.2; }
    [data-part].is-on .lbl, [data-part].is-on .title { fill: var(--dia-ink-on, #F4D470); }
  </style>
  <g data-part="rim" tabindex="0" role="button" aria-label="Obedience to Christ, the rim">
    <text class="title" x="300" y="44" text-anchor="middle">OBEDIENCE TO CHRIST</text>
    <text class="sub" x="300" y="70" text-anchor="middle">THE RIM</text>
    <circle class="body" cx="300" cy="320" r="190"/>
    <circle class="ink" cx="300" cy="320" r="190" stroke-width="5"/>
    <circle class="ink" cx="300" cy="320" r="172" stroke-width="5"/>
    <g class="accent" stroke-width="2.4" opacity=".6"><line x1="423.0" y1="443.0" x2="432.9" y2="452.9"/><line x1="177.0" y1="443.0" x2="167.1" y2="452.9"/><line x1="177.0" y1="197.0" x2="167.1" y2="187.1"/><line x1="423.0" y1="197.0" x2="432.9" y2="187.1"/></g>
  </g>
  <g data-part="prayer" tabindex="0" role="button" aria-label="Prayer, upward spoke">
    <path class="ink spoke" stroke-width="7" d="M300 248 L300 150"/>
    <rect class="pill" x="231.0" y="110" width="138" height="40" rx="20"/>
    <text class="lbl" x="300" y="137" text-anchor="middle">PRAYER</text>
  </g>
  <g data-part="word" tabindex="0" role="button" aria-label="The Word, downward spoke">
    <path class="ink spoke" stroke-width="7" d="M300 392 L300 490"/>
    <rect class="pill" x="219.0" y="490" width="162" height="40" rx="20"/>
    <text class="lbl" x="300" y="517" text-anchor="middle">THE WORD</text>
  </g>
  <g data-part="witness" tabindex="0" role="button" aria-label="Witness, left spoke">
    <path class="ink spoke" stroke-width="7" d="M228 320 L130 320"/>
    <rect class="pill" x="40.0" y="300" width="140" height="40" rx="20"/>
    <text class="lbl" x="110" y="327" text-anchor="middle">WITNESS</text>
  </g>
  <g data-part="fellowship" tabindex="0" role="button" aria-label="Fellowship, right spoke">
    <path class="ink spoke" stroke-width="7" d="M372 320 L470 320"/>
    <rect class="pill" x="400.0" y="300" width="180" height="40" rx="20"/>
    <text class="lbl" x="490" y="327" text-anchor="middle">FELLOWSHIP</text>
  </g>
  <g data-part="hub" tabindex="0" role="button" aria-label="Christ the Center, the hub">
    <circle class="body" cx="300" cy="320" r="72"/>
    <circle class="ink" cx="300" cy="320" r="72" stroke-width="5"/>
    <circle class="accent" cx="300" cy="320" r="61" stroke-width="1.8" opacity=".7"/>
    <text class="title" x="300" y="324" text-anchor="middle" style="font-size:25px">CHRIST</text>
    <text class="sub" x="300" y="348" text-anchor="middle" style="font-size:12px">THE CENTER</text>
  </g>
</svg>
