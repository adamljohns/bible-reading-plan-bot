<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-labelledby="twTitle twDesc">
  <title id="twTitle">The Wheel</title>
  <desc id="twDesc">Original USMC-styled Wheel: Christ the Center, obedience rim, four spokes. Not a NavPress scan.</desc>
  <rect width="320" height="320" fill="#000"/>
  <!-- rim -->
  <g class="spoke" data-part="rim" tabindex="0" role="button" aria-label="Obedience to Christ — rim">
    <circle cx="160" cy="160" r="118" fill="none" stroke="#D4AF37" stroke-width="10"/>
    <text x="160" y="28" text-anchor="middle" fill="#D4AF37" font-size="10" font-family="system-ui,sans-serif">OBEDIENCE</text>
  </g>
  <!-- spokes -->
  <g class="spoke" data-part="word" tabindex="0" role="button" aria-label="The Word — spoke down">
    <line x1="160" y1="196" x2="160" y2="268" stroke="#D4AF37" stroke-width="8"/>
    <text x="160" y="286" text-anchor="middle" fill="#D4AF37" font-size="10" font-family="system-ui,sans-serif">WORD</text>
  </g>
  <g class="spoke" data-part="prayer" tabindex="0" role="button" aria-label="Prayer — spoke up">
    <line x1="160" y1="124" x2="160" y2="52" stroke="#D4AF37" stroke-width="8"/>
    <text x="160" y="46" text-anchor="middle" fill="#D4AF37" font-size="10" font-family="system-ui,sans-serif">PRAYER</text>
  </g>
  <g class="spoke" data-part="fellowship" tabindex="0" role="button" aria-label="Fellowship — spoke right">
    <line x1="196" y1="160" x2="268" y2="160" stroke="#D4AF37" stroke-width="8"/>
    <text x="292" y="164" text-anchor="middle" fill="#D4AF37" font-size="10" font-family="system-ui,sans-serif">FELLOWSHIP</text>
  </g>
  <g class="spoke" data-part="witness" tabindex="0" role="button" aria-label="Witnessing — spoke left">
    <line x1="124" y1="160" x2="52" y2="160" stroke="#D4AF37" stroke-width="8"/>
    <text x="28" y="164" text-anchor="middle" fill="#D4AF37" font-size="10" font-family="system-ui,sans-serif">WITNESS</text>
  </g>
  <!-- hub -->
  <g class="spoke" data-part="hub" tabindex="0" role="button" aria-label="Christ the Center — hub">
    <circle cx="160" cy="160" r="36" fill="#111" stroke="#D4AF37" stroke-width="3"/>
    <text x="160" y="156" text-anchor="middle" fill="#D4AF37" font-size="9" font-family="system-ui,sans-serif">CHRIST</text>
    <text x="160" y="170" text-anchor="middle" fill="#F4D470" font-size="8" font-family="system-ui,sans-serif">CENTER</text>
  </g>
</svg>
