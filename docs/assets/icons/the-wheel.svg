<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" role="img" aria-labelledby="twTitle twDesc">
  <title id="twTitle">The Wheel</title>
  <desc id="twDesc">Original USMC-styled Wheel. Labels sit outside the rim stroke. Not a NavPress scan.</desc>
  <rect width="420" height="420" fill="#000"/>
  <!-- rim first so spokes sit on top of the ring, labels stay outside -->
  <g class="spoke" data-part="rim" tabindex="0" role="button" aria-label="Obedience to Christ — rim">
    <circle cx="210" cy="210" r="92" fill="none" stroke="#D4AF37" stroke-width="10"/>
    <text x="210" y="36" text-anchor="middle" fill="#D4AF37" font-size="12" font-family="system-ui,sans-serif" font-weight="700">OBEDIENCE</text>
  </g>
  <g class="spoke" data-part="prayer" tabindex="0" role="button" aria-label="Prayer — spoke up">
    <line x1="210" y1="118" x2="210" y2="72" stroke="#D4AF37" stroke-width="8"/>
    <text x="210" y="58" text-anchor="middle" fill="#D4AF37" font-size="12" font-family="system-ui,sans-serif" font-weight="700">PRAYER</text>
  </g>
  <g class="spoke" data-part="word" tabindex="0" role="button" aria-label="The Word — spoke down">
    <line x1="210" y1="302" x2="210" y2="348" stroke="#D4AF37" stroke-width="8"/>
    <text x="210" y="372" text-anchor="middle" fill="#D4AF37" font-size="12" font-family="system-ui,sans-serif" font-weight="700">WORD</text>
  </g>
  <g class="spoke" data-part="fellowship" tabindex="0" role="button" aria-label="Fellowship — spoke right">
    <line x1="302" y1="210" x2="348" y2="210" stroke="#D4AF37" stroke-width="8"/>
    <text x="384" y="214" text-anchor="middle" fill="#D4AF37" font-size="11" font-family="system-ui,sans-serif" font-weight="700">FELLOWSHIP</text>
  </g>
  <g class="spoke" data-part="witness" tabindex="0" role="button" aria-label="Witnessing — spoke left">
    <line x1="118" y1="210" x2="72" y2="210" stroke="#D4AF37" stroke-width="8"/>
    <text x="36" y="214" text-anchor="middle" fill="#D4AF37" font-size="12" font-family="system-ui,sans-serif" font-weight="700">WITNESS</text>
  </g>
  <g class="spoke" data-part="hub" tabindex="0" role="button" aria-label="Christ the Center — hub">
    <circle cx="210" cy="210" r="38" fill="#111" stroke="#D4AF37" stroke-width="3"/>
    <text x="210" y="206" text-anchor="middle" fill="#D4AF37" font-size="10" font-family="system-ui,sans-serif" font-weight="700">CHRIST</text>
    <text x="210" y="220" text-anchor="middle" fill="#F4D470" font-size="9" font-family="system-ui,sans-serif">CENTER</text>
  </g>
</svg>
