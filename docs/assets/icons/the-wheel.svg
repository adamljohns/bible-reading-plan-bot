<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" role="img" aria-labelledby="twTitle twDesc">
  <title id="twTitle">The Wheel</title>
  <desc id="twDesc">Original USMC-styled Wheel. Labels sit outside the rim stroke and remain fully visible at 390px. Not a NavPress scan.</desc>
  <rect width="520" height="420" fill="#000"/>
  <g class="spoke" data-part="rim" tabindex="0" role="button" aria-label="Obedience to Christ — rim">
    <circle cx="260" cy="210" r="88" fill="none" stroke="#D4AF37" stroke-width="10"/>
    <text x="260" y="34" text-anchor="middle" fill="#D4AF37" font-size="12" font-family="system-ui,sans-serif" font-weight="700">OBEDIENCE</text>
  </g>
  <g class="spoke" data-part="prayer" tabindex="0" role="button" aria-label="Prayer — spoke up">
    <line x1="260" y1="122" x2="260" y2="78" stroke="#D4AF37" stroke-width="8"/>
    <text x="260" y="64" text-anchor="middle" fill="#D4AF37" font-size="12" font-family="system-ui,sans-serif" font-weight="700">PRAYER</text>
  </g>
  <g class="spoke" data-part="word" tabindex="0" role="button" aria-label="The Word — spoke down">
    <line x1="260" y1="298" x2="260" y2="342" stroke="#D4AF37" stroke-width="8"/>
    <text x="260" y="368" text-anchor="middle" fill="#D4AF37" font-size="12" font-family="system-ui,sans-serif" font-weight="700">WORD</text>
  </g>
  <g class="spoke" data-part="fellowship" tabindex="0" role="button" aria-label="Fellowship — spoke right">
    <line x1="348" y1="210" x2="398" y2="210" stroke="#D4AF37" stroke-width="8"/>
    <text x="458" y="214" text-anchor="middle" fill="#D4AF37" font-size="12" font-family="system-ui,sans-serif" font-weight="700">FELLOWSHIP</text>
  </g>
  <g class="spoke" data-part="witness" tabindex="0" role="button" aria-label="Witnessing — spoke left">
    <line x1="172" y1="210" x2="122" y2="210" stroke="#D4AF37" stroke-width="8"/>
    <text x="62" y="214" text-anchor="middle" fill="#D4AF37" font-size="12" font-family="system-ui,sans-serif" font-weight="700">WITNESS</text>
  </g>
  <g class="spoke" data-part="hub" tabindex="0" role="button" aria-label="Christ the Center — hub">
    <circle cx="260" cy="210" r="36" fill="#111" stroke="#D4AF37" stroke-width="3"/>
    <text x="260" y="206" text-anchor="middle" fill="#D4AF37" font-size="10" font-family="system-ui,sans-serif" font-weight="700">CHRIST</text>
    <text x="260" y="220" text-anchor="middle" fill="#F4D470" font-size="9" font-family="system-ui,sans-serif">CENTER</text>
  </g>
</svg>
