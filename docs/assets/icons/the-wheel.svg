<svg xmlns="http://www.w3.org/2000/svg" viewBox="-22 0 504 460" role="img" aria-labelledby="whTitle whDesc">
  <title id="whTitle">The Wheel</title>
  <desc id="whDesc">Original U.S.M.C. Ministries drawing of the Wheel. Christ at the hub, obedience as the rim, four spokes — the Word, prayer, fellowship and witness. Not a NavPress scan.</desc>

  <style>
    .ink    { stroke: var(--dia-ink, #D4AF37); fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .body   { fill: var(--dia-fill, #101010); }
    .accent { stroke: var(--dia-accent, #8a6f22); fill: none; }
    .lbl    { fill: var(--dia-ink, #D4AF37); font-family: "Playfair Display", Georgia, "Times New Roman", serif;
              font-weight: 700; letter-spacing: .06em; }
    .sub    { fill: var(--dia-muted, #8a8a8a); font-family: Inter, system-ui, sans-serif;
              font-weight: 600; font-size: 11px; letter-spacing: .1em; }
    [data-part] { cursor: pointer; }
    [data-part].is-on .ink   { stroke: var(--dia-ink-on, #F4D470); stroke-width: 7; }
    [data-part].is-on .lbl   { fill: var(--dia-ink-on, #F4D470); }
    [data-part].is-on .spoke { stroke: var(--dia-ink-on, #F4D470); }
  </style>

  <!-- Type wells. Every label sits in the margin OUTSIDE the ink, so nothing
       clips at 390px however long the word is — WITNESS and FELLOWSHIP are the
       two that used to get cut. -->

  <!-- ================= RIM — OBEDIENCE =================
       A real rim has thickness: two concentric circles with the tread between
       them, not a single hairline. -->
  <g data-part="rim" tabindex="0" role="button" aria-label="Obedience to Christ — the rim">
    <circle class="body" cx="230" cy="242" r="150"/>
    <circle class="ink" cx="230" cy="242" r="150" stroke-width="4"/>
    <circle class="ink" cx="230" cy="242" r="134" stroke-width="4"/>
    <!-- tread ticks: weight, and they read as a wheel rather than a target -->
    <g class="accent" stroke-width="2.2" opacity=".55">
      <line x1="230" y1="92"  x2="230" y2="108"/><line x1="230" y1="376" x2="230" y2="392"/>
      <line x1="80"  y1="242" x2="96"  y2="242"/><line x1="364" y1="242" x2="380" y2="242"/>
      <line x1="124" y1="136" x2="135" y2="147"/><line x1="325" y1="337" x2="336" y2="348"/>
      <line x1="336" y1="136" x2="325" y2="147"/><line x1="135" y1="337" x2="124" y2="348"/>
    </g>
    <text class="lbl" x="230" y="34" font-size="17" text-anchor="middle">OBEDIENCE TO CHRIST</text>
    <text class="sub" x="230" y="52" text-anchor="middle">THE RIM</text>
  </g>

  <!-- ================= SPOKES =================
       Hub to rim, INSIDE the wheel. The old drawing pushed them through and
       past the rim, which made a plus sign, not a wheel. Slight taper so they
       read as spokes under tension. -->
  <g data-part="prayer" tabindex="0" role="button" aria-label="Prayer — upward spoke">
    <path class="ink spoke" stroke-width="5" d="M230 194 L230 112"/>
    <text class="lbl" x="230" y="86" font-size="16" text-anchor="middle">PRAYER</text>
  </g>
  <g data-part="word" tabindex="0" role="button" aria-label="The Word — downward spoke">
    <path class="ink spoke" stroke-width="5" d="M230 290 L230 372"/>
    <text class="lbl" x="230" y="404" font-size="16" text-anchor="middle">THE WORD</text>
  </g>
  <g data-part="fellowship" tabindex="0" role="button" aria-label="Fellowship — right spoke">
    <path class="ink spoke" stroke-width="5" d="M278 242 L360 242"/>
    <text class="lbl" x="456" y="238" font-size="16" text-anchor="end">FELLOWSHIP</text>
  </g>
  <g data-part="witness" tabindex="0" role="button" aria-label="Witness — left spoke">
    <path class="ink spoke" stroke-width="5" d="M182 242 L100 242"/>
    <text class="lbl" x="4" y="238" font-size="16" text-anchor="start">WITNESS</text>
  </g>

  <!-- ================= HUB — CHRIST THE CENTER ================= -->
  <g data-part="hub" tabindex="0" role="button" aria-label="Christ the Center — the hub">
    <circle class="body" cx="230" cy="242" r="50"/>
    <circle class="ink" cx="230" cy="242" r="50" stroke-width="4.5"/>
    <circle class="accent" cx="230" cy="242" r="40" stroke-width="1.6" opacity=".7"/>
    <text class="lbl" x="230" y="236" font-size="15" text-anchor="middle">CHRIST</text>
    <text class="lbl" x="230" y="256" font-size="12" text-anchor="middle" opacity=".9">THE CENTER</text>
  </g>
</svg>
