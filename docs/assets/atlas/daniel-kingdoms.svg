<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1100 540" role="img" aria-label="Daniel's prophecy of four kingdoms — the image of four metals"><rect x="0" y="0" width="1100" height="540" fill="#0c0c0c"/>
      <defs>
        <linearGradient id="m-gold" x1="0" y1="0" x2="0.3" y2="1"><stop offset="0" stop-color="#FBE7A0"/><stop offset="0.5" stop-color="#E3C04B"/><stop offset="1" stop-color="#9C7A1E"/></linearGradient>
        <linearGradient id="m-silver" x1="0" y1="0" x2="0.3" y2="1"><stop offset="0" stop-color="#eef3f9"/><stop offset="0.5" stop-color="#b9c6d4"/><stop offset="1" stop-color="#7c8c9c"/></linearGradient>
        <linearGradient id="m-bronze" x1="0" y1="0" x2="0.3" y2="1"><stop offset="0" stop-color="#edc596"/><stop offset="0.5" stop-color="#bd8a52"/><stop offset="1" stop-color="#7d5226"/></linearGradient>
        <linearGradient id="m-iron" x1="0" y1="0" x2="0.3" y2="1"><stop offset="0" stop-color="#d6dae0"/><stop offset="0.5" stop-color="#9aa0a8"/><stop offset="1" stop-color="#5f646b"/></linearGradient>
        <linearGradient id="m-ironclay" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c2c6cc"/><stop offset="0.45" stop-color="#9aa0a8"/><stop offset="0.55" stop-color="#8a6a52"/><stop offset="1" stop-color="#6f5240"/></linearGradient>
        <radialGradient id="m-stone" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#FCEFB4"/><stop offset="0.6" stop-color="#E3C04B"/><stop offset="1" stop-color="#9C7A1E"/></radialGradient>
        <filter id="stone-glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      </defs>

      <!-- The great image of Nebuchadnezzar's dream (Daniel 2), banded in four metals -->
      <a href="bible.html?ref=Daniel%202"><g class="hot" stroke-linejoin="round">
        <!-- pedestal + cast shadow -->
        <ellipse cx="150" cy="450" rx="52" ry="6" fill="#000" opacity="0.4"/>
        <rect x="103" y="447" width="94" height="11" rx="2" fill="#15151a" stroke="#333"/>
        <!-- legs of iron (drawn first; bronze + feet overlap their ends) -->
        <path d="M128,280 C129,322 127,366 127,398 C126,403 130,405 134,405 C138,405 142,403 142,398 C145,366 147,322 147,280 Z" fill="url(#m-iron)" stroke="#4c5158" stroke-width="0.6"/>
        <path d="M172,280 C171,322 173,366 173,398 C174,403 170,405 166,405 C162,405 158,403 158,398 C153,366 155,322 153,280 Z" fill="url(#m-iron)" stroke="#4c5158" stroke-width="0.6"/>
        <!-- feet of iron &amp; clay -->
        <path d="M124,402 L146,402 L147,428 C147,439 139,444 130,444 L116,444 C109,444 107,437 110,431 L117,410 C119,404 121,402 124,402 Z" fill="url(#m-ironclay)" stroke="#4c4138" stroke-width="0.6"/>
        <path d="M176,402 L154,402 L153,428 C153,439 161,444 170,444 L184,444 C191,444 193,437 190,431 L183,410 C181,404 179,402 176,402 Z" fill="url(#m-ironclay)" stroke="#4c4138" stroke-width="0.6"/>
        <!-- belly &amp; thighs of bronze -->
        <path d="M122,210 L178,210 L181,248 C181,258 176,264 170,268 L156,276 L150,281 L144,276 L130,268 C124,264 119,258 119,248 Z" fill="url(#m-bronze)" stroke="#6f4a22" stroke-width="0.6"/>
        <!-- arms (silver), then the chest over them -->
        <path d="M104,124 C94,127 90,137 91,149 L95,197 C95,205 100,209 106,208 L113,206 C118,203 116,194 114,188 L110,150 C109,138 110,130 108,126 Z" fill="url(#m-silver)" stroke="#6f7e8e" stroke-width="0.6"/>
        <path d="M196,124 C206,127 210,137 209,149 L205,197 C205,205 200,209 194,208 L187,206 C182,203 184,194 186,188 L190,150 C191,138 190,130 192,126 Z" fill="url(#m-silver)" stroke="#6f7e8e" stroke-width="0.6"/>
        <path d="M106,122 C104,116 112,114 120,116 L150,113 L180,116 C188,114 196,116 194,122 L186,160 C184,182 180,197 176,205 Q172,211 164,211 L136,211 Q128,211 124,205 C120,197 116,182 114,160 Z" fill="url(#m-silver)" stroke="#6f7e8e" stroke-width="0.7"/>
        <!-- neck, head &amp; crown of gold -->
        <path d="M138,102 L162,102 L160,116 L140,116 Z" fill="url(#m-gold)"/>
        <ellipse cx="150" cy="80" rx="23" ry="27" fill="url(#m-gold)" stroke="#8a6a1f" stroke-width="0.5"/>
        <path d="M124,58 L124,50 L132,50 L137,36 L143,50 L150,30 L157,50 L163,36 L168,50 L176,50 L176,58 Z" fill="url(#m-gold)" stroke="#8a6a1f" stroke-width="0.5"/>
        <circle cx="150" cy="52" r="2.6" fill="#b6453d"/>
        <!-- metallic sheen + band separators -->
        <ellipse cx="142" cy="73" rx="6" ry="10" fill="#fff" opacity="0.18"/>
        <path d="M120,128 C116,150 120,184 130,204" fill="none" stroke="#fff" stroke-width="3" opacity="0.12" stroke-linecap="round"/>
        <path d="M132,214 C128,236 130,256 138,268" fill="none" stroke="#fff" stroke-width="2.5" opacity="0.12" stroke-linecap="round"/>
        <line x1="133" y1="294" x2="131" y2="394" stroke="#fff" stroke-width="2" opacity="0.12" stroke-linecap="round"/>
        <g stroke="#000" stroke-opacity="0.28" stroke-width="1.2"><line x1="124" y1="210.5" x2="176" y2="210.5"/><line x1="126" y1="280.5" x2="174" y2="280.5"/><line x1="120" y1="402.5" x2="180" y2="402.5"/></g>
      </g></a>

      <!-- metal labels -->
      <g font-family="Inter,sans-serif" font-size="10" letter-spacing="1.2" text-anchor="start">
        <g stroke="#555" stroke-width="0.7"><line x1="176" y1="80" x2="196" y2="80"/><line x1="196" y1="160" x2="208" y2="160"/><line x1="182" y1="240" x2="200" y2="240"/><line x1="174" y1="345" x2="200" y2="345"/><line x1="188" y1="424" x2="204" y2="424"/></g>
        <text x="200" y="83" fill="#c9b36a">GOLD</text>
        <text x="212" y="163" fill="#9aa6b2">SILVER</text>
        <text x="204" y="243" fill="#bd9163">BRONZE</text>
        <text x="204" y="348" fill="#9097a0">IRON</text>
        <text x="208" y="427" fill="#8a8276">IRON &amp; CLAY</text>
      </g>

      <!-- the Stone cut without hands, striking the feet -->
      <a href="bible.html?ref=Daniel%202%3A44-45">
      <g class="hot">
        <g stroke="#F4D470" stroke-width="1.3" opacity="0.85" stroke-linecap="round"><line x1="100" y1="432" x2="113" y2="427"/><line x1="101" y1="440" x2="115" y2="442"/><line x1="99" y1="446" x2="111" y2="453"/></g>
        <polygon points="46,442 58,414 86,409 101,437 91,467 56,471" fill="url(#m-stone)" stroke="#D4AF37" stroke-width="1.2" filter="url(#stone-glow)"/>
        <path d="M58,414 L72,440 L101,437 M72,440 L91,467" fill="none" stroke="#9c7a1e" stroke-width="1" opacity="0.55"/>
      </g>
      <text x="24" y="490" font-family="Inter,sans-serif" font-size="11.5" fill="#F4D470" font-weight="700">The Stone</text>
      <text x="24" y="505" font-family="Inter,sans-serif" font-size="9.5" fill="#b9a87a">cut without hands · Dan 2:34</text>
      </a>

      <!-- Empire cards on the right -->
      <g font-family="Inter,sans-serif">
        <!-- Babylon -->
        <a href="bible.html?ref=Daniel%202">
        <rect class="hot" x="300" y="40" width="760" height="66" rx="9" fill="#1c1a12" stroke="#D4AF37"/>
        <rect x="300" y="40" width="8" height="66" rx="4" fill="#D4AF37"/>
        <text x="326" y="66" font-size="16" font-weight="700" fill="#F4D470">Babylon — the Head of Gold</text>
        <text x="326" y="88" font-size="12" fill="#9a8f6a">605–539 BC · Nebuchadnezzar · Daniel 7 beast: the Lion with eagle's wings</text>
        </a>
        <!-- Medo-Persia -->
        <rect x="300" y="116" width="760" height="66" rx="9" fill="#15191d" stroke="#9fb4c9"/>
        <rect x="300" y="116" width="8" height="66" rx="4" fill="#9fb4c9"/>
        <text x="326" y="142" font-size="16" font-weight="700" fill="#cdd9e6">Medo-Persia — Chest &amp; Arms of Silver</text>
        <text x="326" y="164" font-size="12" fill="#8595a3">539–331 BC · Cyrus, Darius · Daniel 7 beast: the Bear raised on one side</text>
        <!-- Greece -->
        <rect x="300" y="192" width="760" height="66" rx="9" fill="#1d160f" stroke="#c98f4b"/>
        <rect x="300" y="192" width="8" height="66" rx="4" fill="#c98f4b"/>
        <text x="326" y="218" font-size="16" font-weight="700" fill="#e0b07a">Greece — Belly &amp; Thighs of Bronze</text>
        <text x="326" y="240" font-size="12" fill="#a8835c">331–168 BC · Alexander the Great · Daniel 7 beast: the four-headed Leopard</text>
        <!-- Rome -->
        <rect x="300" y="268" width="760" height="66" rx="9" fill="#16171a" stroke="#8a8f98"/>
        <rect x="300" y="268" width="8" height="66" rx="4" fill="#8a8f98"/>
        <text x="326" y="294" font-size="16" font-weight="700" fill="#c2c6cc">Rome — Legs of Iron</text>
        <text x="326" y="316" font-size="12" fill="#8b9097">168 BC – AD 476 · Daniel 7 beast: the terrible beast with iron teeth</text>
        <!-- Divided -->
        <rect x="300" y="344" width="760" height="60" rx="9" fill="#161310" stroke="#7a5c4a"/>
        <rect x="300" y="344" width="8" height="60" rx="4" fill="#7a5c4a"/>
        <text x="326" y="368" font-size="15" font-weight="700" fill="#c89f86">Feet of Iron &amp; Clay — a Divided Realm</text>
        <text x="326" y="389" font-size="12" fill="#9a7c6a">"partly strong, partly brittle" — kingdoms that would not cleave together (Dan 2:43)</text>
        <!-- The Stone / Kingdom of God -->
        <a href="bible.html?ref=Daniel%202%3A44-45">
        <rect class="hot" x="300" y="414" width="760" height="68" rx="9" fill="#23200f" stroke="#D4AF37"/>
        <rect x="300" y="414" width="8" height="68" rx="4" fill="#D4AF37"/>
        <text x="326" y="441" font-size="16" font-weight="700" fill="#F4D470">The Stone — the Kingdom of God</text>
        <text x="326" y="464" font-size="12" fill="#b9a87a">"cut out without hands… it shall break in pieces all these kingdoms, and it shall stand forever." (Dan 2:44–45)</text>
        </a>
      </g>
    <text x="550" y="532" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#5a5340">usmcmin.org · the MOOP Bible Translation Engine</text></svg>