<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1100 600" role="img" aria-label="Schematic map of Paul's missionary journeys"><rect x="0" y="0" width="1100" height="600" fill="#0c0c0c"/>
      <!-- sea backdrop + stylized landmasses -->
      <rect x="0" y="0" width="1100" height="600" fill="#0a1418"/>
      <g fill="#13201a" stroke="#21302a" stroke-width="1">
        <!-- Italy / west -->
        <path d="M40,150 Q120,140 150,210 Q160,280 110,300 Q70,250 40,150 Z"/>
        <!-- Greece / Macedonia (north-center) -->
        <path d="M300,120 Q420,110 470,180 Q460,250 380,260 Q320,230 300,120 Z"/>
        <!-- Asia Minor (center-right) -->
        <path d="M520,150 Q740,130 880,170 Q900,250 760,280 Q600,270 520,150 Z"/>
        <!-- Levant / Syria-Judea (right) -->
        <path d="M880,200 Q940,240 930,360 Q900,470 850,470 Q840,330 880,200 Z"/>
        <!-- North Africa / Egypt (bottom) -->
        <path d="M120,470 Q500,440 900,490 L1080,520 L1080,600 L120,600 Z"/>
        <!-- Crete -->
        <path d="M470,400 Q560,392 620,408 Q560,420 470,400 Z"/>
        <!-- Cyprus -->
        <path d="M700,330 Q760,322 790,338 Q740,352 700,330 Z"/>
      </g>
      <text x="70" y="240" font-family="Inter,sans-serif" font-size="11" fill="#2f4a3f" font-style="italic">ITALY</text>
      <text x="360" y="195" font-family="Inter,sans-serif" font-size="11" fill="#2f4a3f" font-style="italic">GREECE</text>
      <text x="690" y="215" font-family="Inter,sans-serif" font-size="11" fill="#2f4a3f" font-style="italic">ASIA MINOR</text>
      <text x="560" y="560" font-family="Inter,sans-serif" font-size="11" fill="#2f4a3f" font-style="italic">THE GREAT SEA (Mediterranean)</text>

      <!-- routes (drawn under the city dots) -->
      <g fill="none" stroke-width="2.4" stroke-linecap="round" opacity="0.9">
        <!-- Journey 1: Antioch→Cyprus→Perga→Pisidian Antioch→Iconium→Lystra→Derbe -->
        <path stroke="#5BA8A0" stroke-dasharray="1 0" d="M880,300 L760,330 L660,250 L600,210 L640,235 L660,255 L690,270"/>
        <!-- Journey 2: Antioch→Derbe/Lystra→Troas→Philippi→Thessalonica→Berea→Athens→Corinth→Ephesus→Caesarea -->
        <path stroke="#C98F4B" d="M880,300 L690,270 L560,205 L470,150 L430,170 L405,190 L380,230 L420,250 L560,235 L840,420"/>
        <!-- Journey 3: Antioch→Ephesus→Macedonia→Greece→Troas→Miletus→Caesarea→Jerusalem -->
        <path stroke="#A98BC5" d="M880,300 L560,235 L430,175 L400,240 L545,250 L600,235 L840,420 L865,455"/>
        <!-- Voyage to Rome: Caesarea→Myra→Crete→Malta→Rome -->
        <path stroke="#C0726B" stroke-dasharray="7 5" d="M865,455 L820,300 L545,408 L300,470 L110,250"/>
      </g>

