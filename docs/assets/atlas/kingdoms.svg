<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1100 560" role="img" aria-label="Timeline of the kingdoms of Israel and Judah"><rect x="0" y="0" width="1100" height="560" fill="#0c0c0c"/>
      <!-- baseline grid: date ticks -->
      <g font-family="Inter,sans-serif" font-size="12" fill="#777" text-anchor="middle">
        <line x1="60" y1="70" x2="1060" y2="70" stroke="#333"/>
        <text x="60" y="58">2100 BC</text><line x1="60" y1="64" x2="60" y2="76" stroke="#555"/>
        <text x="230" y="58">1450 BC</text><line x1="230" y1="64" x2="230" y2="76" stroke="#555"/>
        <text x="430" y="58">1050 BC</text><line x1="430" y1="64" x2="430" y2="76" stroke="#555"/>
        <text x="560" y="58">930 BC</text><line x1="560" y1="64" x2="560" y2="76" stroke="#555"/>
        <text x="820" y="58">722 BC</text><line x1="820" y1="64" x2="820" y2="76" stroke="#555"/>
        <text x="930" y="58">586 BC</text><line x1="930" y1="64" x2="930" y2="76" stroke="#555"/>
        <text x="1020" y="58">430 BC</text><line x1="1020" y1="64" x2="1020" y2="76" stroke="#555"/>
      </g>

      <!-- pre-monarchy eras (single track) -->
      <g font-family="Inter,sans-serif" font-size="13" font-weight="600">
        <a href="bible.html?ref=Genesis%2012"><rect class="hot" x="60" y="95" width="170" height="48" rx="7" fill="#1d1d1d" stroke="#444"/>
          <text x="145" y="118" text-anchor="middle" fill="#e8e8e8">Patriarchs</text>
          <text x="145" y="134" text-anchor="middle" fill="#999" font-size="10.5" font-weight="400">Abraham → Joseph</text></a>
        <a href="bible.html?ref=Exodus%2012"><rect class="hot" x="234" y="95" width="192" height="48" rx="7" fill="#1d1d1d" stroke="#444"/>
          <text x="330" y="118" text-anchor="middle" fill="#e8e8e8">Egypt &amp; the Exodus</text>
          <text x="330" y="134" text-anchor="middle" fill="#999" font-size="10.5" font-weight="400">Bondage → Sinai</text></a>
        <a href="bible.html?ref=Judges%202"><rect class="hot" x="430" y="95" width="126" height="48" rx="7" fill="#1d1d1d" stroke="#444"/>
          <text x="493" y="118" text-anchor="middle" fill="#e8e8e8">Conquest</text>
          <text x="493" y="134" text-anchor="middle" fill="#999" font-size="10.5" font-weight="400">&amp; the Judges</text></a>
      </g>

      <!-- United Monarchy -->
      <a href="bible.html?ref=2%20Samuel%205"><rect class="hot" x="560" y="95" width="100" height="48" rx="7" fill="#2a2410" stroke="#D4AF37"/>
        <text x="610" y="116" text-anchor="middle" fill="#F4D470" font-size="12.5" font-weight="700" font-family="Inter,sans-serif">United</text>
        <text x="610" y="132" text-anchor="middle" fill="#b9a87a" font-size="10" font-family="Inter,sans-serif">Saul·David·Solomon</text></a>

      <!-- Divided Kingdom: two parallel tracks -->
      <!-- Israel (north) -->
      <a href="bible.html?ref=1%20Kings%2012">
        <rect class="hot" x="664" y="160" width="156" height="56" rx="7" fill="#3a201e" stroke="#c0726b"/>
        <text x="676" y="184" fill="#e7b3ae" font-size="13" font-weight="700" font-family="Inter,sans-serif">ISRAEL — North</text>
        <text x="676" y="202" fill="#c79a96" font-size="10.5" font-family="Inter,sans-serif">10 tribes · capital Samaria</text>
      </a>
      <text x="828" y="190" font-family="Inter,sans-serif" font-size="10.5" fill="#c0726b" font-weight="600">↯ Assyria</text>
      <text x="828" y="204" font-family="Inter,sans-serif" font-size="10.5" fill="#a85"> 722 BC</text>

      <!-- Judah (south) -->
      <a href="bible.html?ref=2%20Kings%2025">
        <rect class="hot" x="664" y="232" width="266" height="56" rx="7" fill="#2a2410" stroke="#D4AF37"/>
        <text x="676" y="256" fill="#F4D470" font-size="13" font-weight="700" font-family="Inter,sans-serif">JUDAH — South</text>
        <text x="676" y="274" fill="#b9a87a" font-size="10.5" font-family="Inter,sans-serif">line of David · capital Jerusalem · the temple</text>
      </a>
      <text x="938" y="262" font-family="Inter,sans-serif" font-size="10.5" fill="#D4AF37" font-weight="600">↯ Babylon</text>
      <text x="938" y="276" font-family="Inter,sans-serif" font-size="10.5" fill="#a85"> 586 BC</text>

      <!-- connector from united to the split -->
      <path d="M660 119 L664 119 M662 119 L662 188 L664 188 M662 119 L662 260 L664 260" fill="none" stroke="#555" stroke-width="1.4"/>

      <!-- Exile + Return -->
      <a href="bible.html?ref=Daniel%201"><rect class="hot" x="930" y="160" width="64" height="56" rx="7" fill="#161616" stroke="#555"/>
        <text x="962" y="186" text-anchor="middle" fill="#cfcfcf" font-size="12" font-weight="700" font-family="Inter,sans-serif">Exile</text>
        <text x="962" y="202" text-anchor="middle" fill="#888" font-size="9.5" font-family="Inter,sans-serif">in Babylon</text></a>
      <a href="bible.html?ref=Ezra%201"><rect class="hot" x="930" y="232" width="130" height="56" rx="7" fill="#13211a" stroke="#3e7d63"/>
        <text x="995" y="256" text-anchor="middle" fill="#9ad9b8" font-size="12" font-weight="700" font-family="Inter,sans-serif">The Return</text>
        <text x="995" y="274" text-anchor="middle" fill="#7fae93" font-size="9.5" font-family="Inter,sans-serif">Ezra · Nehemiah</text></a>

      <!-- prophets band -->
      <g font-family="Inter,sans-serif" font-size="11" fill="#7d8a94">
        <text x="60" y="350" font-size="12" fill="#D4AF37" font-weight="600">Prophets to the kingdoms:</text>
        <text x="664" y="350" fill="#c79a96">Hosea · Amos (to Israel)</text>
        <text x="664" y="368" fill="#b9a87a">Isaiah · Micah · Jeremiah (to Judah)</text>
        <text x="930" y="350" fill="#9aa">Ezekiel · Daniel (in exile)</text>
        <text x="930" y="368" fill="#9ad9b8">Haggai · Zechariah · Malachi (return)</text>
      </g>

      <!-- key kings of the united monarchy callout -->
      <g font-family="Inter,sans-serif" font-size="11" fill="#999">
        <text x="60" y="420" font-size="12" fill="#D4AF37" font-weight="600">The United Monarchy (c. 1050–930 BC):</text>
        <text x="60" y="440">
          <tspan fill="#bbb">Saul</tspan>  →  <tspan fill="#bbb">David</tspan>  →  <tspan fill="#bbb">Solomon</tspan>  — one kingdom, before the division under Rehoboam &amp; Jeroboam.
        </text>
      </g>
    <text x="550" y="552" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#5a5340">usmcmin.org · the MOOP Bible Translation Engine</text></svg>