<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1100 600" role="img" aria-label="Daniel's prophecy of the seventy weeks"><rect x="0" y="0" width="1100" height="600" fill="#0c0c0c"/>
      <defs>
        <linearGradient id="wk7" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cda863"/><stop offset="1" stop-color="#8a6a33"/></linearGradient>
        <linearGradient id="wk62" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F4D470"/><stop offset="1" stop-color="#b08c1d"/></linearGradient>
        <linearGradient id="wk70" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cf877d"/><stop offset="1" stop-color="#7c322b"/></linearGradient>
        <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#F4D470" stop-opacity="0.85"/><stop offset="0.55" stop-color="#D4AF37" stop-opacity="0.22"/><stop offset="1" stop-color="#D4AF37" stop-opacity="0"/></radialGradient>
        <filter id="glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      </defs>

      <!-- epigraph -->
      <text x="550" y="30" text-anchor="middle" font-family="'Playfair Display',serif" font-size="15" fill="#F4D470" font-style="italic">“Seventy weeks are determined… to anoint the Most Holy.”</text>
      <text x="550" y="48" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#8a7c52">Daniel 9:24</text>

      <!-- 69-sevens bracket -->
      <path d="M70,86 L70,78 L760,78 L760,86" fill="none" stroke="#D4AF37" stroke-width="1.3" opacity="0.8"/>
      <text x="415" y="72" text-anchor="middle" font-family="Inter,sans-serif" font-size="11.5" fill="#D4AF37" font-weight="600">69 sevens · 483 years — “unto Messiah the Prince”</text>

      <!-- segment counts -->
      <g font-family="Inter,sans-serif" text-anchor="middle">
        <text x="145" y="112" font-size="14" font-weight="700" fill="#e9d49a">7 sevens</text><text x="145" y="128" font-size="10.5" fill="#9a875a">49 years</text>
        <text x="490" y="112" font-size="14" font-weight="700" fill="#F4D470">62 sevens</text><text x="490" y="128" font-size="10.5" fill="#b89a4e">434 years</text>
        <text x="895" y="112" font-size="14" font-weight="700" fill="#e0a59c">the 70th seven</text><text x="895" y="128" font-size="10.5" fill="#b07c74">7 years</text>
      </g>

      <!-- the timeline bar -->
      <a href="bible.html?ref=Daniel%209%3A25"><rect class="hot" x="70" y="140" width="150" height="38" fill="url(#wk7)"/></a>
      <a href="bible.html?ref=Daniel%209%3A25"><rect class="hot" x="220" y="140" width="540" height="38" fill="url(#wk62)"/></a>
      <a href="bible.html?ref=Daniel%209%3A27"><rect class="hot" x="760" y="140" width="270" height="38" fill="url(#wk70)"/></a>
      <rect x="70" y="140" width="960" height="38" rx="7" fill="none" stroke="#000" stroke-opacity="0.35"/>
      <line x1="220" y1="136" x2="220" y2="182" stroke="#1a1408" stroke-width="2"/>
      <line x1="760" y1="136" x2="760" y2="182" stroke="#2a1310" stroke-width="2"/>

      <!-- M1 the decree -->
      <a href="bible.html?ref=Nehemiah%202">
        <circle class="hot" cx="70" cy="159" r="7" fill="#F4D470"/>
        <text x="60" y="210" font-family="Inter,sans-serif" font-size="12" font-weight="700" fill="#F4D470">The Decree</text>
        <text x="60" y="226" font-family="Inter,sans-serif" font-size="10.5" fill="#9a875a">to restore &amp; build Jerusalem</text>
        <text x="60" y="241" font-family="Inter,sans-serif" font-size="10.5" fill="#7d6f48">c. 457–445 BC · Ezra 7 / Neh 2</text>
      </a>

      <!-- M2 Messiah the Prince -->
      <circle cx="760" cy="159" r="30" fill="url(#halo)"/>
      <a href="bible.html?ref=Luke%203%3A21-22">
        <path class="hot" transform="translate(760,159)" filter="url(#glow)" d="M0,-14 L3.29,-4.53 13.32,-4.33 5.33,1.73 8.23,11.33 0,5.6 -8.23,11.33 -5.33,1.73 -13.32,-4.33 -3.29,-4.53 Z" fill="#F8E08A" stroke="#D4AF37" stroke-width="0.8"/>
        <text x="760" y="206" text-anchor="middle" font-family="Inter,sans-serif" font-size="12.5" font-weight="700" fill="#F4D470">Messiah the Prince</text>
        <text x="760" y="222" text-anchor="middle" font-family="Inter,sans-serif" font-size="10.5" fill="#b89a4e">the Anointed One · c. AD 27</text>
      </a>

      <!-- M3 the Cross — midst of the 70th week -->
      <line x1="895" y1="178" x2="895" y2="250" stroke="#5a2a25" stroke-width="1.2" stroke-dasharray="3 3"/>
      <circle cx="895" cy="159" r="22" fill="url(#halo)" opacity="0.8"/>
      <a href="bible.html?ref=Luke%2023">
        <g class="hot" transform="translate(895,159)" filter="url(#glow)" fill="#F8E08A">
          <rect x="-3.5" y="-15" width="7" height="32" rx="1.5"/><rect x="-11" y="-6" width="22" height="7" rx="1.5"/>
        </g>
        <text x="895" y="268" text-anchor="middle" font-family="Inter,sans-serif" font-size="12.5" font-weight="700" fill="#e7b8b0">Messiah cut off — the Cross</text>
        <text x="895" y="284" text-anchor="middle" font-family="Inter,sans-serif" font-size="10.5" fill="#c08e87">“but not for Himself” (9:26)</text>
        <text x="895" y="299" text-anchor="middle" font-family="Inter,sans-serif" font-size="10.5" fill="#a8736c">in the midst of the week, sacrifice ceases · c. AD 30–33</text>
      </a>

      <!-- M4 destruction of Jerusalem, AD 70 (beyond) -->
      <line x1="1030" y1="159" x2="1056" y2="159" stroke="#5a4636" stroke-width="1.2" stroke-dasharray="4 3"/>
      <g class="ruin" fill="#8a6a52" transform="translate(1058,150)"><rect x="-2" y="0" width="6" height="18"/><rect x="6" y="-6" width="6" height="24"/><rect x="14" y="-2" width="6" height="20"/></g>
      <a href="bible.html?ref=Luke%2021%3A20-24">
        <rect class="hot" x="900" y="192" width="175" height="52" rx="6" fill="#161310" stroke="#4a3a2a"/>
        <text x="1065" y="210" text-anchor="end" font-family="Inter,sans-serif" font-size="11.5" font-weight="700" fill="#b7a08a">City &amp; sanctuary destroyed</text>
        <text x="1065" y="225" text-anchor="end" font-family="Inter,sans-serif" font-size="10" fill="#8d7a66">“the people of the prince” (9:26)</text>
        <text x="1065" y="239" text-anchor="end" font-family="Inter,sans-serif" font-size="10" fill="#776550">AD 70 · Rome</text>
      </a>

      <!-- The sixfold purpose -->
      <text x="70" y="346" font-family="'Playfair Display',serif" font-size="17" fill="#D4AF37">The Sixfold Purpose <tspan font-family="Inter,sans-serif" font-size="12" fill="#8a7c52">— Daniel 9:24, all fulfilled in the Messiah</tspan></text>
      <a href="bible.html?ref=Daniel%209%3A24">
      <g font-family="Inter,sans-serif">
        <g class="hot"><rect x="70" y="366" width="300" height="84" rx="10" fill="#16140c" stroke="#4a3f22"/><text x="92" y="412" font-family="'Playfair Display',serif" font-size="30" fill="#D4AF37" opacity="0.5">1</text><text x="126" y="406" font-size="13.5" fill="#e8e8e8">Finish the transgression</text><text x="126" y="426" font-size="10.5" fill="#8d8266">an end to rebellion against God</text></g>
        <g class="hot"><rect x="400" y="366" width="300" height="84" rx="10" fill="#16140c" stroke="#4a3f22"/><text x="422" y="412" font-family="'Playfair Display',serif" font-size="30" fill="#D4AF37" opacity="0.5">2</text><text x="456" y="406" font-size="13.5" fill="#e8e8e8">Make an end of sins</text><text x="456" y="426" font-size="10.5" fill="#8d8266">sin atoned for and put away</text></g>
        <g class="hot"><rect x="730" y="366" width="300" height="84" rx="10" fill="#16140c" stroke="#4a3f22"/><text x="752" y="412" font-family="'Playfair Display',serif" font-size="30" fill="#D4AF37" opacity="0.5">3</text><text x="786" y="406" font-size="13.5" fill="#e8e8e8">Reconcile iniquity</text><text x="786" y="426" font-size="10.5" fill="#8d8266">at the cross (Heb 9–10)</text></g>
        <g class="hot"><rect x="70" y="462" width="300" height="84" rx="10" fill="#16140c" stroke="#4a3f22"/><text x="92" y="508" font-family="'Playfair Display',serif" font-size="30" fill="#D4AF37" opacity="0.5">4</text><text x="126" y="502" font-size="13.5" fill="#e8e8e8">Everlasting righteousness</text><text x="126" y="522" font-size="10.5" fill="#8d8266">brought in by Christ</text></g>
        <g class="hot"><rect x="400" y="462" width="300" height="84" rx="10" fill="#16140c" stroke="#4a3f22"/><text x="422" y="508" font-family="'Playfair Display',serif" font-size="30" fill="#D4AF37" opacity="0.5">5</text><text x="456" y="502" font-size="13.5" fill="#e8e8e8">Seal up vision &amp; prophecy</text><text x="456" y="522" font-size="10.5" fill="#8d8266">fulfilled and confirmed</text></g>
        <g class="hot"><rect x="730" y="462" width="300" height="84" rx="10" fill="#16140c" stroke="#4a3f22"/><text x="752" y="508" font-family="'Playfair Display',serif" font-size="30" fill="#D4AF37" opacity="0.5">6</text><text x="786" y="502" font-size="13.5" fill="#e8e8e8">Anoint the Most Holy</text><text x="786" y="522" font-size="10.5" fill="#8d8266">the Holy One, Jesus Christ</text></g>
      </g>
      </a>
    <text x="550" y="592" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#5a5340">usmcmin.org · the MOOP Bible Translation Engine</text></svg>