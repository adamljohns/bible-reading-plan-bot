<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="canonical" href="https://usmcmin.org/readings/">
  <title>Daily Readings — USMC Ministries</title>
  <meta name="description" content="Today's MOOP daily reading — wisdom, husband, father, citizen, and peace tracks.">
  <style>
    body { font-family: Inter, -apple-system, sans-serif; background:#000; color:#eee;
           display:flex; min-height:100vh; align-items:center; justify-content:center; margin:0; text-align:center; }
    a { color:#D4AF37; text-decoration:none; font-weight:600; }
    p { margin:.6rem 0; }
  </style>
  <script>
    (function () {
      function iso(d) { return d.toISOString().slice(0, 10); }
      var offsets = [0, 1, 2, 3, 4, 5, 6, 7];
      var i = 0;
      function next() {
        if (i >= offsets.length) {
          window.location.replace('/bible-plan.html');
          return;
        }
        var d = new Date();
        d.setDate(d.getDate() - offsets[i++]);
        var url = iso(d) + '.html';
        fetch(url, { method: 'HEAD' }).then(function (r) {
          if (r.ok) window.location.replace(url);
          else next();
        }).catch(next);
      }
      next();
    })();
  </script>
</head>
<body>
  <div>
    <p>Loading today's reading…</p>
    <p><a href="/bible-plan.html">Bible reading plan</a></p>
  </div>
</body>
</html>
