        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-dark: #000000;
            --bg-card: #111111;
            --bg-card-hover: #1a1a1a;
            --bg-step: #1c1c1c;
            --gold: #D4AF37;
            --gold-light: #F4D470;
            --gold-dim: rgba(212,175,55,0.15);
            --white: #FFFFFF;
            --gray: #888888;
            --gray-light: #aaaaaa;
            --border: #333333;
            --green: #4CAF50;
            --yellow: #FFC107;
            --red: #f44336;
            --blue: #2196F3;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: var(--white);
            min-height: 100vh;
            line-height: 1.6;
        }

        h1, h2, h3, h4 { font-family: 'Playfair Display', serif; font-weight: 700; }

        /* ── PIN Screen ── */
        #pin-screen {
            position: fixed; inset: 0;
            background: #000;
            display: flex; align-items: center; justify-content: center;
            z-index: 9999;
            flex-direction: column; gap: 24px;
        }
        #pin-screen.hidden { display: none; }
        .pin-box {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 40px 48px;
            text-align: center;
            max-width: 340px; width: 90%;
        }
        .pin-box .lock-icon { font-size: 2.5rem; margin-bottom: 12px; }
        .pin-box h2 { font-size: 1.4rem; margin-bottom: 6px; color: var(--gold); font-family: 'Playfair Display', serif; }
        .pin-box p { color: var(--gray); font-size: 0.85rem; margin-bottom: 24px; }
        .pin-dots {
            display: flex; gap: 12px; justify-content: center;
            margin-bottom: 28px;
        }
        .pin-dot {
            width: 14px; height: 14px; border-radius: 50%;
            border: 2px solid var(--border);
            background: transparent;
            transition: all 0.15s;
        }
        .pin-dot.filled { background: var(--gold); border-color: var(--gold); }
        .pin-keypad {
            display: grid; grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }
        .pin-key {
            background: #1a1a1a;
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--white);
            font-size: 1.3rem;
            font-weight: 600;
            padding: 16px;
            cursor: pointer;
            transition: all 0.15s;
        }
        .pin-key:hover { background: #252525; border-color: var(--gold); color: var(--gold); }
        .pin-key.del { font-size: 1rem; color: var(--gray); }
        .pin-error { color: var(--red); font-size: 0.85rem; margin-top: 12px; min-height: 20px; }

        /* ── Main Content ── */
        #main-content { display: block; }

        /* ── Header ── */
        .page-header {
            text-align: center;
            padding: 28px 20px 18px;
            border-bottom: 1px solid var(--border);
        }
        .page-header h1 { font-size: 1.9rem; color: var(--white); margin-bottom: 4px; }
        .page-header .subtitle { color: var(--gold); font-size: 0.9rem; }
        .page-header .stats-row {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin-top: 12px;
            flex-wrap: wrap;
        }
        .stat-pill {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 5px 14px;
            font-size: 0.8rem;
            color: var(--gray-light);
        }
        .stat-pill span { color: var(--gold); font-weight: 600; }

        /* ── Nav Links ── */
        .nav-links {
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 12px 20px;
            flex-wrap: wrap;
            border-bottom: 1px solid var(--border);
        }
        .nav-link {
            color: var(--gray-light);
            text-decoration: none;
            font-size: 0.82rem;
            padding: 5px 12px;
            border: 1px solid var(--border);
            border-radius: 20px;
            transition: all 0.2s;
        }
        .nav-link:hover { color: var(--gold); border-color: var(--gold); }

        /* ── Filter Bar ── */
        .filter-bar {
            display: flex;
            gap: 8px;
            padding: 16px 20px;
            max-width: 960px;
            margin: 0 auto;
            flex-wrap: wrap;
        }
        .filter-btn {
            padding: 7px 18px;
            border: 1px solid var(--border);
            border-radius: 20px;
            background: transparent;
            color: var(--gray-light);
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            transition: all 0.2s;
        }
        .filter-btn:hover { border-color: var(--gold); color: var(--gold); }
        .filter-btn.active { background: var(--gold); color: #000; border-color: var(--gold); font-weight: 600; }

        /* ── Workflow Grid ── */
        .workflow-grid {
            max-width: 960px;
            margin: 0 auto;
            padding: 0 16px 40px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
            gap: 14px;
        }

        /* ── Workflow Card ── */
        .workflow-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 18px 20px;
            cursor: pointer;
            transition: all 0.25s;
            position: relative;
        }
        .workflow-card:hover {
            background: var(--bg-card-hover);
            border-color: var(--gold);
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(212,175,55,0.12);
        }
        .workflow-card.expanded {
            border-color: var(--gold);
            background: var(--bg-card-hover);
        }

        /* Card header row */
        .card-header {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 12px;
        }
        .card-icon { font-size: 1.6rem; line-height: 1; flex-shrink: 0; padding-top: 2px; }
        .card-meta { flex: 1; min-width: 0; }
        .card-title {
            font-family: 'Playfair Display', serif;
            color: var(--gold);
            font-size: 1.05rem;
            line-height: 1.2;
            margin-bottom: 4px;
        }
        .card-category {
            font-size: 0.75rem;
            color: var(--gray);
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }
        .status-badge {
            font-size: 0.78rem;
            padding: 3px 10px;
            border-radius: 12px;
            font-weight: 600;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .status-active   { background: rgba(76,175,80,0.15);  color: #6fcf74; border: 1px solid rgba(76,175,80,0.3); }
        .status-waiting  { background: rgba(255,193,7,0.15);  color: #ffd54f; border: 1px solid rgba(255,193,7,0.3); }
        .status-blocked  { background: rgba(244,67,54,0.15);  color: #ef9a9a; border: 1px solid rgba(244,67,54,0.3); }
        .status-complete { background: rgba(33,150,243,0.15); color: #90caf9; border: 1px solid rgba(33,150,243,0.3); }

        /* Progress bar */
        .progress-section { margin-bottom: 10px; }
        .progress-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }
        .progress-label { font-size: 0.78rem; color: var(--gray); }
        .progress-pct { font-size: 0.78rem; color: var(--gold); font-weight: 600; }
        .progress-bar {
            height: 5px;
            background: var(--border);
            border-radius: 3px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--gold), var(--gold-light));
            border-radius: 3px;
            transition: width 0.4s ease;
        }

        /* Current step callout */
        .current-step-row {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.83rem;
            color: var(--gray-light);
        }
        .current-step-dot {
            width: 7px; height: 7px;
            border-radius: 50%;
            background: var(--gold);
            flex-shrink: 0;
            box-shadow: 0 0 6px var(--gold);
        }
        .current-step-name { color: var(--white); font-weight: 500; }

        /* Expand toggle */
        .expand-hint {
            text-align: right;
            font-size: 0.72rem;
            color: var(--gray);
            margin-top: 10px;
            transition: color 0.2s;
        }
        .workflow-card:hover .expand-hint { color: var(--gold); }

        /* ── Expanded Detail ── */
        .card-detail {
            display: none;
            margin-top: 18px;
            padding-top: 18px;
            border-top: 1px solid var(--border);
        }
        .workflow-card.expanded .card-detail { display: block; animation: fadeIn 0.25s ease; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

        /* Step list */
        .steps-list { list-style: none; display: flex; flex-direction: column; gap: 6px; }
        .step-item {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 9px 12px;
            border-radius: 8px;
            background: var(--bg-step);
            border: 1px solid transparent;
            transition: all 0.2s;
        }
        .step-item.step-done {
            opacity: 0.55;
        }
        .step-item.step-done .step-name { text-decoration: line-through; color: var(--gray); }
        .step-item.step-current {
            background: var(--gold-dim);
            border-color: var(--gold);
        }
        .step-item.step-next {
            border-color: rgba(212,175,55,0.35);
        }
        .step-num {
            width: 22px; height: 22px;
            border-radius: 50%;
            background: var(--border);
            color: var(--gray);
            font-size: 0.72rem;
            font-weight: 700;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
            margin-top: 1px;
        }
        .step-item.step-done .step-num { background: rgba(76,175,80,0.2); color: var(--green); }
        .step-item.step-current .step-num { background: var(--gold); color: #000; }
        .step-item.step-next .step-num { background: rgba(212,175,55,0.2); color: var(--gold); }
        .step-body { flex: 1; min-width: 0; }
        .step-name { font-size: 0.87rem; color: var(--white); font-weight: 500; }
        .step-tag {
            font-size: 0.7rem;
            padding: 1px 7px;
            border-radius: 8px;
            display: inline-block;
            margin-top: 3px;
        }
        .tag-current { background: rgba(212,175,55,0.2); color: var(--gold); }
        .tag-next    { background: rgba(212,175,55,0.12); color: var(--gold-light); }
        .tag-done    { background: rgba(76,175,80,0.15); color: #6fcf74; }

        /* Action buttons */
        .card-actions {
            display: flex;
            gap: 8px;
            margin-top: 16px;
            flex-wrap: wrap;
        }
        .btn-advance {
            padding: 8px 18px;
            background: var(--gold);
            color: #000;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.83rem;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            transition: background 0.2s;
        }
        .btn-advance:hover { background: var(--gold-light); }
        .btn-advance:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn-back {
            padding: 8px 14px;
            background: transparent;
            color: var(--gray);
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.83rem;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s;
        }
        .btn-back:hover { border-color: var(--gray-light); color: var(--white); }
        .btn-back:disabled { opacity: 0.3; cursor: not-allowed; }
        .btn-reset {
            padding: 8px 14px;
            background: transparent;
            color: var(--red);
            border: 1px solid rgba(244,67,54,0.3);
            border-radius: 8px;
            font-size: 0.83rem;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s;
            margin-left: auto;
        }
        .btn-reset:hover { background: rgba(244,67,54,0.1); }

        /* ── Empty state ── */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            color: var(--gray);
        }

        /* ── Responsive ── */
        @media (max-width: 600px) {

            .page-header h1 { font-size: 1.5rem; }
            .filter-bar { padding: 12px; }
        }

<script>
// ── PIN ──────────────────────────────────────────────────────────
const WF_PIN = '5683';
const WF_SESSION_KEY = 'wf_unlocked';
let wfPinEntry = '';

(function checkWfPinSession() {
    if (sessionStorage.getItem(WF_SESSION_KEY) === 'true') wfUnlock();
})();

function wfUnlock() {
    document.getElementById('pin-screen').classList.add('hidden');
    document.getElementById('main-content').style.display = '';
}

function pinKey(d) {
    if (wfPinEntry.length >= 4) return;
    wfPinEntry += d;
    updatePinDots();
    if (wfPinEntry.length === 4) setTimeout(checkWfPin, 100);
}

function pinDel() {
    wfPinEntry = wfPinEntry.slice(0, -1);
    updatePinDots();
    document.getElementById('pin-error').textContent = '';
}

function updatePinDots() {
    for (let i = 0; i < 4; i++) {
        document.getElementById('dot-' + i).classList.toggle('filled', i < wfPinEntry.length);
    }
}

function checkWfPin() {
    if (wfPinEntry === WF_PIN) {
        sessionStorage.setItem(WF_SESSION_KEY, 'true');
        wfUnlock();
    } else {
        document.getElementById('pin-error').textContent = 'Incorrect PIN. Try again.';
        wfPinEntry = '';
        updatePinDots();
        document.querySelectorAll('.pin-dot').forEach(d => {
            d.style.borderColor = '#f44336';
            setTimeout(() => d.style.borderColor = '', 600);
        });
    }
}

document.addEventListener('keydown', (e) => {
    if (document.getElementById('pin-screen').classList.contains('hidden')) return;
    if (e.key >= '0' && e.key <= '9') pinKey(e.key);
    else if (e.key === 'Backspace') pinDel();
});
</script>

// ─────────────────────────────────────────────
//  STATE (localStorage)
// ─────────────────────────────────────────────
const STORAGE_KEY = 'wf-state-v1';

function loadState() {
    try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return null;
        return JSON.parse(raw);
    } catch(e) { return null; }
}

function saveState(workflows) {
    // Save only mutable fields
    const slim = workflows.map(w => ({
        id: w.id,
        currentStep: w.currentStep,
        status: w.status,
    }));
    localStorage.setItem(STORAGE_KEY, JSON.stringify(slim));
    // Also write to a visible export blob so MbPro can read it
    try {
        const exportData = {
            exportedAt: new Date().toISOString(),
            workflows: slim
        };
        localStorage.setItem('wf-export-latest', JSON.stringify(exportData));
    } catch(e) {}
}

function exportStateToClipboard() {
    try {
        const slim = workflows.map(w => ({
            id: w.id,
            title: w.title,
            currentStep: w.currentStep,
            totalSteps: w.steps.length,
            status: w.status,
            currentStepName: w.steps[w.currentStep] ? w.steps[w.currentStep].name : 'Complete'
        }));
        const exportData = JSON.stringify({ exportedAt: new Date().toISOString(), workflows: slim }, null, 2);
        navigator.clipboard.writeText(exportData).then(() => {
            alert('Workflow state copied to clipboard! Paste it to MbPro.');
        });
    } catch(e) { alert('Copy failed: ' + e); }
}

function mergeState(defaults) {
    const saved = loadState();
    if (!saved) return defaults.map(w => ({...w, steps: w.steps.map(s=>({...s}))}));
    return defaults.map(w => {
        const override = saved.find(s => s.id === w.id);
        if (override) {
            return { ...w, steps: w.steps.map(s=>({...s})), currentStep: override.currentStep, status: override.status };
        }
        return {...w, steps: w.steps.map(s=>({...s}))};
    });
}

// ─────────────────────────────────────────────
//  RENDER
// ─────────────────────────────────────────────
let workflows = [];
let activeFilter = 'All';
let expandedId = null;

function pct(w) {
    if (w.steps.length === 0) return 0;
    return Math.round((w.currentStep / w.steps.length) * 100);
}

function renderStats() {
    const el = document.getElementById('stats-row');
    const active   = workflows.filter(w => w.status === 'active').length;
    const complete = workflows.filter(w => w.status === 'complete').length;
    const waiting  = workflows.filter(w => w.status === 'waiting').length;
    const blocked  = workflows.filter(w => w.status === 'blocked').length;
    el.innerHTML = `
        <div class="stat-pill">Total <span>${workflows.length}</span></div>
        <div class="stat-pill">🟢 Active <span>${active}</span></div>
        <div class="stat-pill">✅ Complete <span>${complete}</span></div>
        <div class="stat-pill">🟡 Waiting <span>${waiting}</span></div>
        <div class="stat-pill">🔴 Blocked <span>${blocked}</span></div>
    `;
}

function renderFilters() {
    const bar = document.getElementById('filter-bar');
    bar.innerHTML = CATEGORIES.map(cat => `
        <button class="filter-btn ${activeFilter === cat ? 'active' : ''}"
            onclick="setFilter('${cat}')">${cat}</button>
    `).join('');
}

function setFilter(cat) {
    activeFilter = cat;
    renderFilters();
    renderGrid();
}

function renderGrid() {
    const grid = document.getElementById('workflow-grid');
    const visible = activeFilter === 'All'
        ? workflows
        : workflows.filter(w => w.category === activeFilter);

    if (!visible.length) {
        grid.innerHTML = `<div class="empty-state"><div class="icon"><img src="assets/icons/shield-compass.png" alt="" width="16" height="16" style="vertical-align:middle;margin-right:3px;"></div><p>No workflows in this category yet.</p></div>`;
        return;
    }

    grid.innerHTML = visible.map(w => renderCard(w)).join('');

    // Re-attach event listeners
    visible.forEach(w => {
        const card = document.getElementById('card-' + w.id);
        if (card) {
            card.addEventListener('click', (e) => {
                // Don't toggle if clicking buttons
                if (e.target.closest('button')) return;
                toggleExpand(w.id);
            });
        }
    });
}

function renderCard(w) {
    const st = STATUS_LABELS[w.status] || STATUS_LABELS.active;
    const progress = pct(w);
    const currentStepName = w.currentStep < w.steps.length
        ? w.steps[w.currentStep].name
        : 'Complete';
    const stepDisplay = `Step ${w.currentStep + 1} of ${w.steps.length}`;
    const isExpanded = expandedId === w.id;
    const isComplete = w.currentStep >= w.steps.length;

    return `
    <div class="workflow-card ${isExpanded ? 'expanded' : ''}" id="card-${w.id}">
        <div class="card-header">
            <div class="card-icon">${w.icon}</div>
            <div class="card-meta">
                <div class="card-title">${w.title}</div>
                <div class="card-category">${w.category}</div>
            </div>
            <div class="status-badge ${st.cls}">${st.icon} ${st.label}</div>
        </div>

        <div class="progress-section">
            <div class="progress-row">
                <span class="progress-label">${isComplete ? 'Finished!' : stepDisplay}</span>
                <span class="progress-pct">${progress}%</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" style="width:${progress}%"></div>
            </div>
        </div>

        ${!isComplete ? `
        <div class="current-step-row">
            <div class="current-step-dot"></div>
            <span>Now: <span class="current-step-name">${currentStepName}</span></span>
        </div>
        ` : `
        <div class="current-step-row">
            <span style="color:var(--green);">✅ All steps complete!</span>
        </div>
        `}

        <div class="expand-hint">${isExpanded ? '▲ Collapse' : '▼ Expand steps'}</div>

        <div class="card-detail">
            ${renderStepList(w)}
            <div class="card-actions">
                <button class="btn-back" onclick="stepBack('${w.id}')" ${w.currentStep <= 0 ? 'disabled' : ''}>← Back</button>
                <button class="btn-advance" onclick="stepAdvance('${w.id}')" ${isComplete ? 'disabled' : ''}>
                    ${w.currentStep === 0 ? 'Mark Started' : isComplete ? '✅ Done' : 'Mark Complete →'}
                </button>
                <button class="btn-reset" onclick="resetWorkflow('${w.id}')">↺ Reset</button>
            </div>
        </div>
    </div>
    `;
}

function renderStepList(w) {
    return `<ul class="steps-list">` +
        w.steps.map((step, i) => {
            let cls = '';
            let tag = '';
            if (i < w.currentStep) {
                cls = 'step-done';
                tag = `<span class="step-tag tag-done">✓ Done</span>`;
            } else if (i === w.currentStep) {
                cls = 'step-current';
                tag = `<span class="step-tag tag-current">▶ Current</span>`;
            } else if (i === w.currentStep + 1) {
                cls = 'step-next';
                tag = `<span class="step-tag tag-next">⚡ What's Next</span>`;
            }
            return `
            <li class="step-item ${cls}">
                <div class="step-num">${i + 1}</div>
                <div class="step-body">
                    <div class="step-name">${step.name}</div>
                    ${tag}
                    ${step.desc && cls !== 'step-done' ? `<div style="font-size:0.77rem; color:var(--gray); margin-top:3px;">${step.desc}</div>` : ''}
                </div>
            </li>
            `;
        }).join('') +
    `</ul>`;
}

// ─────────────────────────────────────────────
//  ACTIONS
// ─────────────────────────────────────────────
function toggleExpand(id) {
    expandedId = (expandedId === id) ? null : id;
    renderGrid();
}

function stepAdvance(id) {
    const w = workflows.find(w => w.id === id);
    if (!w) return;
    if (w.currentStep < w.steps.length) {
        const stepText = w.steps[w.currentStep] ? (w.steps[w.currentStep].name || '') : '';
        w.currentStep++;
        if (w.currentStep >= w.steps.length) {
            w.status = 'complete';
        }
        saveState(workflows);
        renderStats();
        renderGrid();
        try {
            let log = JSON.parse(localStorage.getItem('workflowCompletionLog') || '[]');
            log.push({ workflow: w.title || w.id, step: stepText, date: new Date().toISOString().slice(0,10), ts: new Date().toISOString() });
            if (log.length > 50) log = log.slice(-50);
            localStorage.setItem('workflowCompletionLog', JSON.stringify(log));
        } catch(e) {}
    }
}

function stepBack(id) {
    const w = workflows.find(w => w.id === id);
    if (!w) return;
    if (w.currentStep > 0) {
        w.currentStep--;
        if (w.status === 'complete') w.status = 'active';
        saveState(workflows);
        renderStats();
        renderGrid();
    }
}

function resetWorkflow(id) {
    if (!confirm('Reset this workflow to step 1?')) return;
    const w = workflows.find(w => w.id === id);
    if (!w) return;
    w.currentStep = 0;
    w.status = 'active';
    saveState(workflows);
    renderStats();
    renderGrid();
}

// ─────────────────────────────────────────────
//  INIT
// ─────────────────────────────────────────────
function init() {
    workflows = mergeState(WORKFLOWS_DEFAULT);
    renderStats();
    renderFilters();
    renderGrid();
}

// Auto-init on load
document.addEventListener('DOMContentLoaded', init);
</script>
