<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="/assets/icons/favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Tracker — MOOP Command</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #000000;
            --card: #111111;
            --card2: #1a1a1a;
            --gold: #D4AF37;
            --gold-light: #F4D470;
            --white: #e8e8e8;
            --gray: #888888;
            --border: #333333;
            --green: #22c55e;
            --yellow: #eab308;
            --red: #ef4444;
            --blue: #3b82f6;
            --purple: #a855f7;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--white);
            min-height: 100vh;
        }
        h1, h2, h3 { font-family: 'Playfair Display', serif; color: var(--gold); }

        /* ── Nav ─────────────────────────────────────── */
        nav {
            display: flex; flex-wrap: wrap; gap: 6px;
            padding: 12px 20px;
            border-bottom: 1px solid var(--border);
            background: #000;
            position: sticky; top: 0; z-index: 100;
        }
        nav a {
            color: var(--gray); text-decoration: none; font-size: 13px;
            padding: 4px 10px; border-radius: 4px; transition: color .2s;
        }
        nav a:hover { color: var(--gold); }
        nav a.active { color: var(--gold); font-weight: 600; }

        /* ── Layout ─────────────────────────────────── */
        .container { max-width: 1400px; margin: 0 auto; padding: 24px 20px; }

        .page-header {
            display: flex; align-items: center; gap: 16px;
            margin-bottom: 24px; padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }
        .page-header h1 { font-size: 28px; }
        .page-header .subtitle { color: var(--gray); font-size: 14px; margin-top: 4px; }
        .refresh-btn {
            margin-left: auto;
            background: var(--card2); border: 1px solid var(--border);
            color: var(--gray); padding: 8px 16px; border-radius: 6px;
            cursor: pointer; font-size: 13px; transition: all .2s;
        }
        .refresh-btn:hover { border-color: var(--gold); color: var(--gold); }

        /* ── Stats Bar ───────────────────────────────── */
        .stats-bar {
            display: flex; flex-wrap: wrap; gap: 12px;
            margin-bottom: 24px;
        }
        .stat-card {
            background: var(--card); border: 1px solid var(--border);
            border-radius: 10px; padding: 16px 20px;
            min-width: 120px; flex: 1;
        }
        .stat-card .value { font-size: 28px; font-weight: 700; color: var(--gold); }
        .stat-card .label { font-size: 12px; color: var(--gray); margin-top: 4px; text-transform: uppercase; letter-spacing: .05em; }

        .cat-badges { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
        .cat-badge {
            display: inline-flex; align-items: center; gap: 5px;
            padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600;
            cursor: pointer; transition: opacity .15s;
        }
        .cat-badge:hover { opacity: .8; }
        .cat-badge .count { background: rgba(0,0,0,.25); border-radius: 10px; padding: 1px 6px; font-size: 11px; }

        /* Category colors */
        .cat-A { background: #1a3a1a; color: #4ade80; border: 1px solid #166534; }
        .cat-B { background: #1a1a3a; color: #818cf8; border: 1px solid #3730a3; }
        .cat-C { background: #3a1a1a; color: #f87171; border: 1px solid #991b1b; }
        .cat-D { background: #2a1a0a; color: #fb923c; border: 1px solid #9a3412; }
        .cat-F { background: #0a2a2a; color: #22d3ee; border: 1px solid #0e7490; }
        .cat-H { background: #1a2a1a; color: #86efac; border: 1px solid #15803d; }
        .cat-M { background: #2a1a2a; color: #d946ef; border: 1px solid #86198f; }
        .cat-P { background: #1a1a1a; color: #94a3b8; border: 1px solid #475569; }

        /* ── Today's 5 ───────────────────────────────── */
        .section { margin-bottom: 28px; }
        .section-title {
            font-family: 'Playfair Display', serif;
            font-size: 18px; color: var(--gold);
            margin-bottom: 14px;
            display: flex; align-items: center; gap: 10px;
        }
        .section-title span { font-family: 'Inter', sans-serif; font-size: 13px; color: var(--gray); font-weight: 400; }

        .todays5-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px;
        }
        .t5-card {
            background: var(--card); border: 1px solid var(--border);
            border-radius: 10px; padding: 14px 16px;
            border-left: 3px solid var(--gold);
            transition: border-color .2s;
        }
        .t5-card:hover { border-left-color: var(--gold-light); }
        .t5-name { font-weight: 600; font-size: 15px; color: var(--white); }
        .t5-meta { font-size: 12px; color: var(--gray); margin-top: 4px; display: flex; gap: 8px; flex-wrap: wrap; }
        .t5-reason { font-size: 11px; color: var(--gold); margin-top: 6px; }
        .t5-actions { display: flex; gap: 6px; margin-top: 10px; }
        .t5-actions button {
            flex: 1; padding: 5px; border-radius: 5px; border: 1px solid var(--border);
            background: var(--card2); color: var(--gray); font-size: 11px; cursor: pointer;
            transition: all .15s;
        }
        .t5-actions button:hover { border-color: var(--gold); color: var(--gold); }

        /* ── Melaleuca Pipeline ──────────────────────── */
        .mel-pipeline {
            display: flex; gap: 0; border: 1px solid var(--border); border-radius: 10px; overflow: hidden;
        }
        .mel-stage {
            flex: 1; padding: 16px 12px; text-align: center;
            background: var(--card); border-right: 1px solid var(--border);
            transition: background .2s; cursor: pointer;
        }
        .mel-stage:last-child { border-right: none; }
        .mel-stage:hover { background: var(--card2); }
        .mel-stage .stage-count { font-size: 24px; font-weight: 700; color: var(--purple); }
        .mel-stage .stage-name { font-size: 11px; color: var(--gray); text-transform: uppercase; letter-spacing: .05em; margin-top: 4px; }
        .mel-arrow { display: flex; align-items: center; color: var(--border); font-size: 20px; padding: 0 2px; }

        /* ── Search & Filters ────────────────────────── */
        .controls {
            display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
            margin-bottom: 16px;
        }
        .search-box {
            flex: 1; min-width: 200px;
            background: var(--card); border: 1px solid var(--border);
            border-radius: 8px; padding: 10px 16px;
            color: var(--white); font-size: 14px; font-family: 'Inter', sans-serif;
            outline: none; transition: border-color .2s;
        }
        .search-box:focus { border-color: var(--gold); }
        .search-box::placeholder { color: var(--gray); }

        .filter-btns { display: flex; flex-wrap: wrap; gap: 6px; }
        .filter-btn {
            padding: 7px 14px; border-radius: 6px; border: 1px solid var(--border);
            background: var(--card); color: var(--gray); font-size: 13px; cursor: pointer;
            transition: all .15s; font-family: 'Inter', sans-serif;
        }
        .filter-btn:hover { border-color: var(--gold); color: var(--gold); }
        .filter-btn.active { background: var(--gold); color: #000; border-color: var(--gold); font-weight: 600; }

        .sort-select {
            background: var(--card); border: 1px solid var(--border);
            color: var(--white); padding: 8px 12px; border-radius: 6px;
            font-family: 'Inter', sans-serif; font-size: 13px; cursor: pointer;
        }

        /* ── Contact Table ───────────────────────────── */
        .results-info { font-size: 13px; color: var(--gray); margin-bottom: 12px; }

        .contacts-table-wrap { overflow-x: auto; }
        table {
            width: 100%; border-collapse: collapse; font-size: 13px;
        }
        th {
            text-align: left; padding: 10px 14px;
            color: var(--gray); font-weight: 600; font-size: 11px;
            text-transform: uppercase; letter-spacing: .05em;
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
        }
        td {
            padding: 11px 14px; border-bottom: 1px solid #1a1a1a;
            vertical-align: middle;
        }
        tr:hover td { background: #0d0d0d; }

        .contact-name { font-weight: 600; color: var(--white); }
        .contact-sub { font-size: 11px; color: var(--gray); margin-top: 2px; }

        .status-dot { font-size: 14px; }
        .badge {
            display: inline-block; padding: 2px 8px; border-radius: 12px;
            font-size: 11px; font-weight: 600;
        }

        .priority-urgent { color: var(--red); font-size: 11px; }
        .priority-high { color: var(--yellow); font-size: 11px; }

        .follow-up-flag { color: var(--gold); font-size: 11px; }

        .action-btns { display: flex; gap: 5px; }
        .action-btns button {
            padding: 4px 8px; border-radius: 4px;
            border: 1px solid var(--border); background: transparent;
            color: var(--gray); font-size: 11px; cursor: pointer;
            transition: all .15s;
        }
        .action-btns button:hover { border-color: var(--gold); color: var(--gold); }

        /* Pagination */
        .pagination { display: flex; gap: 6px; justify-content: center; margin-top: 20px; flex-wrap: wrap; }
        .page-btn {
            padding: 6px 12px; border-radius: 5px; border: 1px solid var(--border);
            background: var(--card); color: var(--gray); font-size: 13px; cursor: pointer;
            transition: all .15s;
        }
        .page-btn:hover { border-color: var(--gold); color: var(--gold); }
        .page-btn.active { background: var(--gold); color: #000; border-color: var(--gold); font-weight: 600; }

        /* ── Loading ─────────────────────────────────── */
        .loading { text-align: center; padding: 60px; color: var(--gray); }
        .loading .spin { font-size: 40px; animation: spin 1s linear infinite; display: inline-block; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .empty-state { text-align: center; padding: 40px; color: var(--gray); }

        /* ── Footer ─────────────────────────────────── */
        footer {
            text-align: center; padding: 20px;
            color: var(--gray); font-size: 12px;
            border-top: 1px solid var(--border); margin-top: 40px;
        }

        @media (max-width: 768px) {
            .mel-pipeline { flex-direction: column; }
            .mel-stage { border-right: none; border-bottom: 1px solid var(--border); }
            .stat-card { min-width: 100px; }
        }
    </style>
</head>
<body>

<nav>
    <a href="/">Home</a>
    <a href="/bible-plan.html">Bible Plan</a>
    <a href="/account-map.html">Account Map</a>
    <a href="/contacts.html" class="active">Contacts</a>
    <a href="/wheelhouse.html">Wheelhouse</a>
</nav>

<div class="container">

    <div class="page-header">
        <div>
            <h1><img src="assets/icons/shield-broadcast-48.png" alt="" width="16" height="16" style="vertical-align:middle;margin-right:3px;"> Contact Tracker</h1>
            <div class="subtitle">Private dashboard — MOOP Command</div>
        </div>
        <button class="refresh-btn" onclick="loadData()">↻ Refresh</button>
    </div>

    <div id="app">
        <div class="loading">
            <div class="spin">⚙️</div>
            <p style="margin-top:12px;">Loading contacts...</p>
        </div>
    </div>

</div>



<script>
// ──────────────────────────────────────────────────
// State
// ──────────────────────────────────────────────────
let allContacts = [];
let filteredContacts = [];
let currentPage = 1;
const PAGE_SIZE = 50;
let activeCategory = 'ALL';
let searchQuery = '';
let sortField = 'name';
let dataInfo = {};

const CATEGORIES = {
    A: { label: 'Bible', emoji: '<img src="assets/icons/shield-bible.png" alt="" width="16" height="16" style="vertical-align:middle;margin-right:3px;">' },
    B: { label: 'Family', emoji: '🏠' },
    C: { label: 'USMC', emoji: '🎖️' },
    D: { label: 'B&A', emoji: '🏠' },
    F: { label: 'fit20', emoji: '💪' },
    H: { label: 'FXBG', emoji: '<img src="assets/icons/shield-church-48.png" alt="" width="16" height="16" style="vertical-align:middle;margin-right:3px;">' },
    M: { label: 'Melaleuca', emoji: '<img src="assets/icons/shield-star.png" alt="" width="16" height="16" style="vertical-align:middle;margin-right:3px;">' },
    P: { label: 'Personal', emoji: '👤' },
};

const STATUS_EMOJI = { green: '🟢', yellow: '🟡', red: '🔴', none: '⚫' };

// ──────────────────────────────────────────────────
// Data Loading
// ──────────────────────────────────────────────────
async function loadData() {
    try {
        const res = await fetch('/assets/contacts-data.json?t=' + Date.now());
        if (!res.ok) throw new Error('Failed to load contacts-data.json');
        const data = await res.json();
        allContacts = data.contacts || [];
        dataInfo = data;
        render();
    } catch (e) {
        document.getElementById('app').innerHTML = `
            <div class="empty-state">
                <div style="font-size:40px;">⚠️</div>
                <p style="margin-top:12px;color:var(--red);">Failed to load contacts data</p>
                <p style="color:var(--gray);font-size:12px;margin-top:8px;">${e.message}</p>
                <p style="color:var(--gray);font-size:12px;margin-top:4px;">Run: <code>python3 scripts/export-contacts-json.py</code></p>
            </div>`;
    }
}

// ──────────────────────────────────────────────────
// Filtering & Sorting
// ──────────────────────────────────────────────────
function applyFilters() {
    let list = [...allContacts];

    if (activeCategory !== 'ALL') {
        list = list.filter(c => (c.category || 'P') === activeCategory);
    }

    if (searchQuery) {
        const q = searchQuery.toLowerCase();
        list = list.filter(c =>
            (c.first_name || '').toLowerCase().includes(q) ||
            (c.last_name || '').toLowerCase().includes(q) ||
            (c.email || '').toLowerCase().includes(q) ||
            (c.phone || '').toLowerCase().includes(q) ||
            (c.notes || '').toLowerCase().includes(q)
        );
    }

    // Sort
    list.sort((a, b) => {
        if (sortField === 'name') {
            const an = ((a.last_name || '') + (a.first_name || '')).toLowerCase();
            const bn = ((b.last_name || '') + (b.first_name || '')).toLowerCase();
            return an.localeCompare(bn);
        }
        if (sortField === 'last_contact') {
            const ad = a.last_contact_date || '0000';
            const bd = b.last_contact_date || '0000';
            return ad < bd ? 1 : -1;
        }
        if (sortField === 'priority') {
            return (b.priority || 0) - (a.priority || 0);
        }
        return 0;
    });

    filteredContacts = list;
    currentPage = 1;
}

// ──────────────────────────────────────────────────
// Render
// ──────────────────────────────────────────────────
function render() {
    applyFilters();
    const html = `
        ${renderStatsBar()}
        ${renderTodays5()}
        ${renderMelPipeline()}
        ${renderControls()}
        <div class="results-info">${filteredContacts.length} contact${filteredContacts.length !== 1 ? 's' : ''} shown</div>
        ${renderTable()}
        ${renderPagination()}
    `;
    document.getElementById('app').innerHTML = html;
    attachEventListeners();
}

function renderStatsBar() {
    const cats = dataInfo.category_counts || {};
    const total = dataInfo.total || allContacts.length;
    const followUp = dataInfo.follow_up_count || 0;

    const catBadges = Object.entries(cats)
        .sort((a, b) => b[1] - a[1])
        .map(([cat, count]) => {
            const info = CATEGORIES[cat] || { label: cat, emoji: '•' };
            return `<span class="cat-badge cat-${cat}" onclick="setCategory('${cat}')">${info.emoji} ${info.label} <span class="count">${count}</span></span>`;
        }).join('');

    return `
    <div class="stats-bar">
        <div class="stat-card">
            <div class="value">${total}</div>
            <div class="label">Total Contacts</div>
        </div>
        <div class="stat-card" style="flex:3;">
            <div class="label" style="margin-bottom:8px;">By Category</div>
            <div class="cat-badges">${catBadges || '<span style="color:var(--gray);font-size:13px;">No data</span>'}</div>
        </div>
        <div class="stat-card" style="border-left:3px solid ${followUp > 0 ? 'var(--gold)' : 'var(--border)'};">
            <div class="value" style="color:${followUp > 0 ? 'var(--gold)' : 'var(--gray)'};">${followUp}</div>
            <div class="label">Follow-ups Needed</div>
        </div>
    </div>`;
}

function renderTodays5() {
    const t5 = dataInfo.todays_5 || [];
    if (t5.length === 0) {
        return `<div class="section">
            <div class="section-title"><img src="assets/icons/shield-target.png" alt="" width="16" height="16" style="vertical-align:middle;margin-right:3px;"> Today's 5 <span>Auto-suggested outreach</span></div>
            <div style="color:var(--gray);font-size:13px;">No priority contacts identified. Add priority flags or follow-ups to see suggestions here.</div>
        </div>`;
    }

    const cards = t5.map(c => {
        const name = [c.first_name, c.last_name].filter(Boolean).join(' ');
        const status = STATUS_EMOJI[c.contact_status] || '⚫';
        const reasons = [];
        if (c.priority === 2) reasons.push('🔴 Urgent');
        else if (c.priority === 1) reasons.push('🟡 High Priority');
        if (c.follow_up_needed) reasons.push('📌 Follow-up flagged');
        if (c.melaleuca_status === 'prospect') reasons.push('<img src="assets/icons/shield-star.png" alt="" width="16" height="16" style="vertical-align:middle;margin-right:3px;"> Mel prospect');
        if (c.melaleuca_status === 'interested') reasons.push('<img src="assets/icons/shield-star.png" alt="" width="16" height="16" style="vertical-align:middle;margin-right:3px;"> Mel interested');
        if (!c.last_contact_date) reasons.push('⚫ Never contacted');

        return `
        <div class="t5-card">
            <div class="t5-name">${status} ${escHtml(name)}</div>
            <div class="t5-meta">
                ${c.email ? `<span>✉️ ${escHtml(c.email)}</span>` : ''}
                ${c.phone ? `<span>📞 ${escHtml(c.phone)}</span>` : ''}
                ${c.last_contact_date ? `<span>Last: ${c.last_contact_date}</span>` : ''}
            </div>
            <div class="t5-reason">${reasons.join(' · ')}</div>
            <div class="t5-actions">
                <button title="Log call">📞 Call</button>
                <button title="Log text"><img src="assets/icons/shield-broadcast-48.png" alt="" width="16" height="16" style="vertical-align:middle;margin-right:3px;"> Text</button>
                <button title="Log email">✉️ Email</button>
            </div>
        </div>`;
    }).join('');

    return `<div class="section">
        <div class="section-title"><img src="assets/icons/shield-target.png" alt="" width="16" height="16" style="vertical-align:middle;margin-right:3px;"> Today's 5 <span>Auto-suggested outreach</span></div>
        <div class="todays5-grid">${cards}</div>
    </div>`;
}

function renderMelPipeline() {
    const p = dataInfo.melaleuca_pipeline || {};
    const total = Object.values(p).reduce((a, b) => a + b, 0);
    if (total === 0 && allContacts.length > 0) {
        // Just show empty pipeline for reference
    }

    const stages = [
        { key: 'prospect', label: 'Prospects', emoji: '👀' },
        { key: 'interested', label: 'Interested', emoji: '<img src="assets/icons/shield-broadcast-48.png" alt="" width="16" height="16" style="vertical-align:middle;margin-right:3px;">' },
        { key: 'enrolled', label: 'Enrolled', emoji: '✅' },
        { key: 'active', label: 'Active', emoji: '⚡' },
        { key: 'builder', label: 'Builders', emoji: '🏗️' },
    ];

    const stageHtml = stages.map(s =>
        `<div class="mel-stage" onclick="filterMelStage('${s.key}')">
            <div class="stage-count">${p[s.key] || 0}</div>
            <div class="stage-name">${s.emoji} ${s.label}</div>
        </div>`
    ).join('');

    return `<div class="section">
        <div class="section-title"><img src="assets/icons/shield-star.png" alt="" width="16" height="16" style="vertical-align:middle;margin-right:3px;"> Melaleuca Pipeline <span>Click a stage to filter</span></div>
        <div class="mel-pipeline">${stageHtml}</div>
    </div>`;
}

function renderControls() {
    const catBtns = ['ALL', 'A', 'B', 'C', 'D', 'F', 'H', 'M', 'P'].map(cat => {
        const label = cat === 'ALL' ? 'All' : (CATEGORIES[cat]?.label || cat);
        const active = activeCategory === cat ? ' active' : '';
        return `<button class="filter-btn${active}" onclick="setCategory('${cat}')">${label}</button>`;
    }).join('');

    return `<div class="section">
        <div class="controls">
            <input type="text" class="search-box" id="searchInput"
                placeholder="<img src="assets/icons/shield-compass.png" alt="" width="16" height="16" style="vertical-align:middle;margin-right:3px;"> Search by name, email, phone..."
                value="${escHtml(searchQuery)}" oninput="onSearch(this.value)">
            <select class="sort-select" onchange="setSort(this.value)">
                <option value="name" ${sortField==='name'?'selected':''}>Sort: Name</option>
                <option value="last_contact" ${sortField==='last_contact'?'selected':''}>Sort: Last Contact</option>
                <option value="priority" ${sortField==='priority'?'selected':''}>Sort: Priority</option>
            </select>
        </div>
        <div class="filter-btns">${catBtns}</div>
    </div>`;
}

function renderTable() {
    const start = (currentPage - 1) * PAGE_SIZE;
    const pageContacts = filteredContacts.slice(start, start + PAGE_SIZE);

    if (pageContacts.length === 0) {
        return `<div class="empty-state">
            <div style="font-size:32px;"><img src="assets/icons/shield-compass.png" alt="" width="16" height="16" style="vertical-align:middle;margin-right:3px;"></div>
            <p style="margin-top:12px;">No contacts match your filter.</p>
        </div>`;
    }

    const rows = pageContacts.map(c => {
        const name = [c.first_name, c.last_name].filter(Boolean).join(' ');
        const cat = c.category || 'P';
        const catInfo = CATEGORIES[cat] || { label: cat, emoji: '•' };
        const status = STATUS_EMOJI[c.contact_status] || '⚫';
        const priorityLabel = c.priority === 2
            ? '<span class="priority-urgent">🔴 Urgent</span>'
            : c.priority === 1
            ? '<span class="priority-high">🟡 High</span>'
            : '';
        const followUpFlag = c.follow_up_needed
            ? `<span class="follow-up-flag">📌 ${c.follow_up_date || 'follow-up'}</span>` : '';
        const melStatus = c.melaleuca_status
            ? `<span class="badge" style="background:#2a1a2a;color:#d946ef;border:1px solid #86198f;"><img src="assets/icons/shield-star.png" alt="" width="16" height="16" style="vertical-align:middle;margin-right:3px;"> ${c.melaleuca_status}</span>` : '';
        const fitStatus = c.fit20_status
            ? `<span class="badge" style="background:#0a2a2a;color:#22d3ee;border:1px solid #0e7490;">💪 ${c.fit20_status}</span>` : '';

        return `<tr>
            <td>
                <div class="contact-name">${escHtml(name)}</div>
                <div class="contact-sub">${escHtml(c.notes || '').substring(0,60)}</div>
            </td>
            <td><span class="cat-badge cat-${cat}">${catInfo.emoji} ${catInfo.label}</span></td>
            <td>
                <div>${escHtml(c.email || '—')}</div>
                <div style="color:var(--gray);font-size:11px;">${escHtml(c.phone || '')}</div>
            </td>
            <td>
                <span class="status-dot">${status}</span>
                ${c.last_contact_date ? `<span style="font-size:11px;color:var(--gray);margin-left:4px;">${c.last_contact_date}</span>` : ''}
                ${c.last_contact_method ? `<div style="font-size:11px;color:var(--gray);">${c.last_contact_method}</div>` : ''}
            </td>
            <td>
                ${priorityLabel} ${followUpFlag}
                <div style="margin-top:3px;">${melStatus} ${fitStatus}</div>
            </td>
            <td>
                <div class="action-btns">
                    <button title="Log contact"><img src="assets/icons/shield-blog-quill-48.png" alt="" width="16" height="16" style="vertical-align:middle;margin-right:3px;"> Log</button>
                    <button title="Edit">✏️</button>
                </div>
            </td>
        </tr>`;
    }).join('');

    return `
    <div class="contacts-table-wrap">
        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Category</th>
                    <th>Contact Info</th>
                    <th>Last Contact</th>
                    <th>Status / Pipeline</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>${rows}</tbody>
        </table>
    </div>`;
}

function renderPagination() {
    const totalPages = Math.ceil(filteredContacts.length / PAGE_SIZE);
    if (totalPages <= 1) return '';

    let pages = [];
    for (let i = 1; i <= totalPages; i++) {
        if (i === 1 || i === totalPages || (i >= currentPage - 2 && i <= currentPage + 2)) {
            pages.push(i);
        } else if (pages[pages.length - 1] !== '...') {
            pages.push('...');
        }
    }

    const btns = pages.map(p => p === '...'
        ? `<span style="color:var(--gray);padding:6px 4px;">...</span>`
        : `<button class="page-btn ${p === currentPage ? 'active' : ''}" onclick="goToPage(${p})">${p}</button>`
    ).join('');

    return `<div class="pagination">${btns}</div>`;
}

// ──────────────────────────────────────────────────
// Event Handlers
// ──────────────────────────────────────────────────
function attachEventListeners() {
    // Search box focus
    const s = document.getElementById('searchInput');
    if (s) s.focus();
}

function setCategory(cat) {
    activeCategory = cat;
    render();
}

function filterMelStage(stage) {
    // Filter contacts by melaleuca stage
    activeCategory = 'ALL';
    searchQuery = '';
    filteredContacts = allContacts.filter(c => c.melaleuca_status === stage);
    currentPage = 1;
    // Re-render without full filter reset
    const html = `
        ${renderStatsBar()}
        ${renderTodays5()}
        ${renderMelPipeline()}
        ${renderControls()}
        <div class="results-info">${filteredContacts.length} contact${filteredContacts.length !== 1 ? 's' : ''} in Melaleuca stage: <strong>${stage}</strong></div>
        ${renderTable()}
        ${renderPagination()}
    `;
    document.getElementById('app').innerHTML = html;
    attachEventListeners();
}

let searchTimeout;
function onSearch(val) {
    clearTimeout(searchTimeout);
    searchTimeout = setTimeout(() => {
        searchQuery = val;
        render();
    }, 150);
}

function setSort(val) {
    sortField = val;
    render();
}

function goToPage(p) {
    currentPage = p;
    window.scrollTo(0, 0);
    // Re-render table and pagination only
    const html = `
        ${renderStatsBar()}
        ${renderTodays5()}
        ${renderMelPipeline()}
        ${renderControls()}
        <div class="results-info">${filteredContacts.length} contact${filteredContacts.length !== 1 ? 's' : ''} shown</div>
        ${renderTable()}
        ${renderPagination()}
    `;
    document.getElementById('app').innerHTML = html;
    attachEventListeners();
}

// ──────────────────────────────────────────────────
// Utility
// ──────────────────────────────────────────────────
function escHtml(str) {
    if (!str) return '';
    return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
}

// ──────────────────────────────────────────────────
// Init
// ──────────────────────────────────────────────────
loadData();
</script>
